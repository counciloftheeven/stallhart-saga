<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="description" content="Stallhart Destanı'ndaki bir hanenin tarihi, arması, üyeleri ve bağlı olduğu eyalet." data-tr="Stallhart Destanı'ndaki bir hanenin tarihi, arması, üyeleri ve bağlı olduğu eyalet." data-en="The history, crest, members and province of a house in the Stallhart Saga." data-i18n-attr="content">

<link rel="stylesheet" href="assets/css/styles.css?v=3.0">
<style>
body{background:var(--bg)}
.wiki-layout{max-width:1100px;margin:0 auto;padding:6rem 2rem 4rem;display:grid;grid-template-columns:1fr 300px;gap:2.5rem;align-items:start}
@media(max-width:800px){.wiki-layout{grid-template-columns:1fr;padding:5rem 1.25rem 3rem}}

.breadcrumb{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--parchd);margin-bottom:1.5rem;font-family:var(--font-display);font-style:italic;flex-wrap:wrap}
.breadcrumb a{color:var(--goldd);text-decoration:none;transition:color .15s}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{color:var(--border)}

.art-eyebrow{font-family:var(--font-display);font-style:italic;font-size:.7rem;letter-spacing:.15em;color:var(--goldd);margin-bottom:.4rem;text-transform:uppercase}
.art-title{font-family:var(--font-display);font-size:clamp(1.8rem,3vw,2.6rem);color:var(--parchl);line-height:1.15;margin-bottom:.25rem}
.art-subtitle{font-size:.9rem;color:var(--gold);font-style:italic;margin-bottom:.85rem}
.art-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1.25rem}
.art-tag{font-family:var(--font-display);font-size:.68rem;padding:.18rem .55rem;border:1px solid var(--border);color:var(--parchd);font-style:italic;text-decoration:none;transition:.15s}
.art-tag:hover{border-color:var(--goldd);color:var(--parchl)}
.art-tag.major{border-color:var(--goldd);color:var(--goldd)}

.toc{background:var(--surface);border:1px solid var(--border);padding:.9rem 1.1rem;margin-bottom:1.5rem}
.toc-title{font-family:var(--font-display);font-size:.75rem;color:var(--goldd);margin-bottom:.5rem;font-style:italic;letter-spacing:.06em}
.toc-list{list-style:none;display:flex;flex-direction:column;gap:.25rem}
.toc-list a{font-family:var(--font-display);font-size:.78rem;color:var(--goldd);text-decoration:none;transition:color .15s}
.toc-list a:hover{color:var(--gold)}

.art-h2{font-family:var(--font-display);font-size:1.3rem;color:var(--parchl);margin:2.5rem 0 .8rem;padding-top:.5rem;border-top:1px solid var(--border);scroll-margin-top:70px}
.art-h2:first-of-type{border-top:none;margin-top:0}
.art-p{font-size:.94rem;line-height:1.9;color:var(--parch);margin-bottom:1rem}

/* Hane amblemi */
.sigil{
  width:140px;height:160px;margin:0 auto 1.25rem;position:relative;
  clip-path:polygon(50% 0%,100% 22%,100% 70%,50% 100%,0% 70%,0% 22%);
  display:flex;align-items:center;justify-content:center;text-align:center;
  border:2px solid var(--house-accent,var(--goldd));
  box-shadow:0 0 24px var(--house-glow,rgba(184,115,51,.18));
}
.sigil-inner{padding:1rem;font-family:var(--font-display);font-size:.8rem;color:var(--parchl);line-height:1.4}

.color-swatches{display:flex;gap:.5rem;margin:.75rem 0 1.5rem}
.swatch{width:32px;height:32px;border:1px solid var(--border);flex-shrink:0}

/* Sağ panel */
.hib{background:var(--surface);border:1px solid var(--border);overflow:hidden;position:sticky;top:70px}
.hib-head{padding:1.5rem 1.25rem;text-align:center;border-bottom:1px solid var(--border);background:var(--deep)}
.hib-tier{font-family:var(--font-display);font-style:italic;font-size:.72rem;color:var(--house-accent,var(--goldd));letter-spacing:.06em}
.hib-rows{padding:1rem 1.25rem}
.hib-row{display:flex;justify-content:space-between;gap:.75rem;padding:.55rem 0;border-bottom:1px solid rgba(58,47,36,.35);font-size:.82rem}
.hib-row:last-child{border-bottom:none}
.hib-k{color:var(--parchd);font-style:italic}
.hib-v{color:var(--parch);text-align:right}
.hib-v a{color:var(--goldd);text-decoration:none}
.hib-v a:hover{color:var(--gold)}

/* ── KİLİT FİGÜRLER .cc GRID YAPISI ────────────────── */
.cc-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:1.25rem;
  margin-top:1rem;
}
.cc-grid .cc{
  margin:0;
  text-decoration:none;
  padding:1.35rem;
  transition:all .2s ease;
}
.cc-grid .cc:hover{
  transform:translateY(-2px);
  border-color:var(--house-accent,var(--gold));
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}

/* ── TARİHÇE & KRONİKLER GRID YAPISI ───────────────── */
.house-history-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:1.25rem;
  margin-top:1rem;
}
.house-history-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:4px;
  padding:1.25rem;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:all .2s ease;
  position:relative;
}
.house-history-card:hover{
  border-color:var(--house-accent,var(--goldd));
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.35);
}
.hh-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.5rem;
  margin-bottom:.45rem;
}
.hh-ks{
  font-family:var(--font-display);
  font-size:.88rem;
  color:var(--gold);
  font-weight:bold;
}
.hh-type{
  font-family:var(--font-display);
  font-size:.68rem;
  padding:.15rem .45rem;
  border:1px solid var(--border);
  border-radius:3px;
  color:var(--parchd);
}
.hh-title{
  font-family:var(--font-display);
  font-size:1.05rem;
  color:var(--parchl);
  margin-bottom:.25rem;
  line-height:1.25;
}
.hh-ruler{
  font-size:.76rem;
  color:var(--goldd);
  font-style:italic;
  margin-bottom:.5rem;
}
.hh-desc{
  font-size:.84rem;
  line-height:1.65;
  color:var(--parch);
  margin-bottom:.85rem;
}
.hh-link{
  font-family:var(--font-display);
  font-size:.75rem;
  color:var(--gold);
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:.3rem;
  transition:color .15s ease;
  margin-top:auto;
}
.hh-link:hover{
  color:var(--goldb);
}

/* ── İLGİLİ BÖLÜMLER GRID YAPISI ───────────────────── */
.house-chapters-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:1.25rem;
  margin-top:1rem;
}
.house-chapter-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:4px;
  padding:1.25rem;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-decoration:none;
  transition:all .2s ease;
}
.house-chapter-card:hover{
  border-color:var(--house-accent,var(--gold));
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(0,0,0,.4);
}
.hch-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.5rem;
  margin-bottom:.4rem;
}
.hch-num{
  font-family:var(--font-display);
  font-size:.78rem;
  color:var(--goldb);
  letter-spacing:.05em;
}
.hch-ks{
  font-size:.72rem;
  color:var(--parchd);
  font-style:italic;
}
.hch-title{
  font-family:var(--font-display);
  font-size:1.15rem;
  color:var(--parchl);
  margin-bottom:.35rem;
}
.hch-pov{
  font-size:.78rem;
  color:var(--goldd);
  margin-bottom:.5rem;
  font-style:italic;
}
.hch-synopsis{
  font-size:.82rem;
  line-height:1.6;
  color:var(--parchd);
  margin-bottom:.85rem;
}
.hch-cta{
  font-family:var(--font-display);
  font-size:.76rem;
  color:var(--gold);
  display:inline-flex;
  align-items:center;
  gap:.3rem;
  margin-top:auto;
}
.house-chapter-card:hover .hch-cta{
  color:var(--goldb);
}

/* ── EVREN ANSİKLOPEDİSİ KÖPRÜLERİ ─────────────────── */
.house-lore-links{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  gap:1rem;
  margin-top:1rem;
}
.house-lore-link-card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:1rem 1.15rem;
  border-radius:4px;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:.75rem;
  transition:all .2s ease;
}
.house-lore-link-card:hover{
  border-color:var(--goldd);
  background:rgba(184,115,51,.08);
  transform:translateY(-2px);
}
.hl-icon{font-size:1.3rem;flex-shrink:0}
.hl-title{font-family:var(--font-display);font-size:.88rem;color:var(--parchl);line-height:1.2}
.hl-sub{font-size:.74rem;color:var(--parchd);font-style:italic;margin-top:.15rem}

.not-found{padding:4rem 1rem;text-align:center}
.not-found h2{font-family:var(--font-display);font-size:1.6rem;color:var(--parchl);margin-bottom:.75rem}
.not-found a{color:var(--goldd);text-decoration:none;font-family:var(--font-display);font-style:italic}

.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--deep) 50%,var(--surface) 75%);background-size:200% 100%;animation:skelShine 1.4s ease-in-out infinite}
@keyframes skelShine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:14px;border-radius:2px;margin-bottom:.6rem}
</style>

<body>

<div class="wiki-layout" id="wiki-root">
  <div id="content-main">
    <div class="skel skel-line" style="width:40%"></div>
    <div class="skel skel-line" style="width:70%;height:32px;margin-bottom:1rem"></div>
    <div class="skel skel-line" style="width:100%"></div>
    <div class="skel skel-line" style="width:95%"></div>
    <div class="skel skel-line" style="width:88%"></div>
  </div>
  <div id="content-side">
    <div class="skel" style="height:280px"></div>
  </div>
</div>

<script src="assets/js/config.js?v=3.0"></script>
<script src="assets/js/patches.js?v=3.0"></script>
<script src="assets/js/wiki.js?v=3.0"></script>
<script src="assets/js/community.js?v=3.0"></script>
<script>
'use strict';
const { Lang, loadData, initWiki, esc } = Wiki;

let allHouses = {};   // id -> {house, province}
let allChars  = {};
let loreEvents= [];
let allChapters = [];

const TIER_LABEL = {
  imperial: { tr: 'İmparatorluk Hanedanı', en: 'Imperial Dynasty' },
  major:    { tr: 'Büyük Soylu Hane',       en: 'Major Noble House' },
  minor:    { tr: 'Küçük Soylu Hane',        en: 'Minor Noble House' },
  client:   { tr: 'Bağımlı Hane',            en: 'Vassal House' },
};

function getHouseId() {
  return SWRoute.id('hane');
}

function yerSlug(name) {
  if (window.Wiki && Wiki.Book) return Wiki.Book.slug(name);
  const map = { 'ı':'i','İ':'i','ş':'s','Ş':'s','ğ':'g','Ğ':'g','ü':'u','Ü':'u','ö':'o','Ö':'o','ç':'c','Ç':'c' };
  return String(name || '').replace(/[ıİşŞğĞüÜöÖçÇ]/g, m => map[m]).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').substring(0, 60);
}

async function init() {
  try {
    const [housesData, charsData, loreData, chaptersData] = await Promise.all([
      loadData('houses.json'),
      loadData('characters.json'),
      loadData('lore.json').catch(() => ({ events: [] })),
      loadData('chapters.json').catch(() => ({ chapters: [] }))
    ]);

    (housesData?.provinces || []).forEach(prov => {
      (prov.houses || []).forEach(h => { allHouses[h.id] = { house: h, province: prov }; });
    });
    (charsData?.characters || []).forEach(c => { allChars[c.id] = c; });
    loreEvents  = (loreData && loreData.events) || [];
    allChapters = (chaptersData && chaptersData.chapters) || [];

    render();
  } catch (err) {
    console.error('Hane verisi yüklenemedi:', err);
    Wiki.renderError('content-main', err);
    const side = document.getElementById('content-side');
    if (side) side.innerHTML = '';
  }
}

function render() {
  const l = Lang.get(), t = o => Lang.t(o);
  const id = getHouseId();
  const entry = allHouses[id];

  if (!id || !entry) {
    document.getElementById('content-main').innerHTML = `
      <div class="not-found">
        <h2>${l === 'tr' ? 'Hane Bulunamadı' : 'House Not Found'}</h2>
        <p style="color:var(--parchd);font-style:italic">${l === 'tr' ? 'Aradığın hane mevcut değil.' : 'The house you are looking for does not exist.'}</p>
        <br><a href="haneler.html">← ${l === 'tr' ? 'Tüm Haneler' : 'All Houses'}</a>
      </div>`;
    document.getElementById('content-side').innerHTML = '';
    document.title = '404 · Stallhart Wiki';
    return;
  }

  const h = entry.house, prov = entry.province;
  document.title = `${h.name} · Stallhart Wiki`;
  document.documentElement.lang = l;

  const accent = (h.colors && h.colors[1]) || (h.colors && h.colors[0]) || '#b87333';
  const wrap = document.getElementById('wiki-root');
  if (wrap) wrap.style.setProperty('--house-accent', accent);

  /* Hane Üyeleri */
  const memberIdSet = new Set(h.memberIds || []);
  const members = [];
  (h.memberIds || []).forEach(mid => {
    if (allChars[mid]) members.push(allChars[mid]);
  });
  // Grup veya hane adı eşleşen diğer karakterleri de ekle
  Object.values(allChars).forEach(c => {
    if (memberIdSet.has(c.id)) return;
    const hNameMatch = c.house && (t(c.house).toLowerCase().includes(h.name.toLowerCase()));
    const grpMatch   = c.group && c.group.toLowerCase() === h.id.toLowerCase();
    if (hNameMatch || grpMatch) {
      members.push(c);
      memberIdSet.add(c.id);
    }
  });

  const bannerSrc = Wiki.safeImg(h.banner);
  const motto = t(h.motto) || (h.motto && typeof h.motto === 'object' ? (h.motto.tr || h.motto.en || '') : '');

  /* Sayfa Üstveri Senkronizasyonu (Page Metadata Sync) */
  const houseTitle = `${h.name} ${l === 'tr' ? 'Hanesi' : 'House'} · Stallhart Wiki`;
  document.title = houseTitle;
  const houseDesc = motto
    ? `${h.name} ${l === 'tr' ? 'Hanesi' : 'House'} — “${motto}”. ${t(h.meaning) || t(h.origin) || t(h.desc) || ''}`.trim()
    : `${h.name} ${l === 'tr' ? 'Hanesi' : 'House'}. ${t(h.meaning) || t(h.origin) || t(h.desc) || ''}`.trim();

  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute('content', houseDesc);
  const ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) ogTitle.setAttribute('content', houseTitle);
  const ogDesc = document.querySelector('meta[property="og:description"]');
  if (ogDesc) ogDesc.setAttribute('content', houseDesc);
  const twTitle = document.querySelector('meta[name="twitter:title"]');
  if (twTitle) twTitle.setAttribute('content', houseTitle);
  const twDesc = document.querySelector('meta[name="twitter:description"]');
  if (twDesc) twDesc.setAttribute('content', houseDesc);

  /* Hane Tarihçesi & Kronikleri */
  const houseEvents = loreEvents.filter(e => {
    const r = (e.ruler || '').toLowerCase();
    const nameTr = (e.name?.tr || '').toLowerCase();
    const descTr = (e.desc?.tr || '').toLowerCase();
    const hLow = h.name.toLowerCase();
    const hIdLow = h.id.toLowerCase();

    if (r.includes(hLow) || nameTr.includes(hLow) || descTr.includes(hLow)) return true;
    if (hIdLow === 'stallhart' && (e.type === 'ruler' || r.includes('stallhart'))) return true;
    // Hane üyelerinden biri geçiyorsa
    return members.some(m => {
      const mName = t(m.name).toLowerCase();
      return mName.length > 3 && (nameTr.includes(mName) || descTr.includes(mName) || r.includes(mName));
    });
  });

  /* İlgili Bölümler */
  const memberNameSet = members.map(m => t(m.name).toLowerCase());
  const memberChaptersSet = new Set();
  members.forEach(m => {
    (m.chapters || []).forEach(chTitle => memberChaptersSet.add(String(chTitle).toLowerCase()));
  });

  const relatedChapters = allChapters.filter(ch => {
    const pov = (t(ch.pov) || '').toLowerCase();
    const syn = (t(ch.synopsis) || '').toLowerCase();
    const title = (t(ch.title) || '').toLowerCase();
    const hLow = h.name.toLowerCase();

    if (pov.includes(hLow) || syn.includes(hLow)) return true;
    if (memberChaptersSet.has(title) || memberChaptersSet.has('bölüm – ' + title) || memberChaptersSet.has('bölüm - ' + title)) return true;
    return memberNameSet.some(mn => mn.length > 3 && (pov.includes(mn) || syn.includes(mn)));
  });

  const typeLabels = {
    ruler:    l === 'tr' ? '👑 Hükümdar'  : '👑 Ruler',
    war:      l === 'tr' ? '⚔️ Savaş'     : '⚔️ War',
    crisis:   l === 'tr' ? '🔥 Kriz'      : '🔥 Crisis',
    religious:l === 'tr' ? '⚖️ Dinî Olay' : '⚖️ Religious'
  };

  const mainHTML = `
    <div>
      <nav class="breadcrumb">
        <a href="index.html">${l === 'tr' ? 'Ana Sayfa' : 'Home'}</a><span>›</span>
        <a href="haneler.html">${l === 'tr' ? 'Haneler' : 'Houses'}</a><span>›</span>
        <strong style="color:var(--house-accent,var(--goldb))">${esc(h.name)}</strong>
      </nav>

      <div class="house-crest-wrap">
        <div class="hcb-flag house-crest-banner" style="--banner-c2:${esc(accent)}">
          ${bannerSrc
            ? `<div class="hcb-flag-frame"><img class="hc-banner-img" data-zoom ${Wiki.imgAttrs(bannerSrc,'(max-width:700px) 60vw, 260px',{eager:true})} alt="${esc(h.name)} — ${l === 'tr' ? 'bayrak' : 'banner'}"></div>`
            : bannerPlaceholder(l, h.name)}
          <button type="button" class="hcb-share-btn" id="hcb-share-btn" aria-label="${l === 'tr' ? 'Haneyi Paylaş' : 'Share House'}" title="${l === 'tr' ? 'Sayfayı Paylaş' : 'Share'}">
            <svg class="hcb-share-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span class="hcb-share-text">${l === 'tr' ? 'Paylaş' : 'Share'}</span>
          </button>
        </div>
        <div>
          <div class="art-eyebrow">${l === 'tr' ? 'Hane Maddesi' : 'House Article'}</div>
          <h1 class="art-title">${esc(h.name)} ${l === 'tr' ? 'Hanesi' : 'House'}</h1>
          <p class="art-subtitle">"${esc(t(h.meaning))}"</p>
          <p class="house-crest-motto${motto ? '' : ' hcm-empty'}">${esc(motto)}</p>
        </div>
      </div>

      <div class="art-tags">
        <a href="haneler.html" class="art-tag major">${esc(t(prov.name))}</a>
        <span class="art-tag">${esc((TIER_LABEL[h.tier] || TIER_LABEL.minor)[l])}</span>
        ${(h.tags || []).map(tg => `<span class="art-tag">#${esc(tg)}</span>`).join('')}
      </div>

      <div class="toc">

          <li><a href="#tarihce">4. ${l === 'tr' ? 'Hane Tarihçesi & Kronikler' : 'House Chronicles'} (${houseEvents.length})</a></li>
          <li><a href="#bolumler">5. ${l === 'tr' ? 'İlgili Bölümler & Kayıtlar' : 'Related Chapters'} (${relatedChapters.length})</a></li>
          <li><a href="#ansiklopedi">6. ${l === 'tr' ? 'Evren Ansiklopedisi Bağlantısı' : 'World Encyclopedia'}</a></li>
        </ul>
      </div>

      <!-- 1. KÖKEN -->

      <p class="art-p">${esc(t(h.origin) || t(h.desc) || (l === 'tr' ? 'Bu hane hakkında ayrıntılı kayıt bulunmuyor.' : 'No detailed record exists for this house.'))}</p>

      <!-- 2. SEMBOLLER -->
      <h2 class="art-h2" id="semboller">${l === 'tr' ? 'Semboller & Renkler' : 'Symbols & Colors'}</h2>
      <div class="sigil">
        <div class="sigil-inner">${esc(t(h.symbol) || h.name)}</div>
      </div>
      <p class="art-p" style="text-align:center;font-style:italic;color:var(--parchd);font-size:.82rem;margin-top:-.5rem">${esc(t(h.symbol))}</p>
      <p class="art-p">${esc(t(h.desc))}</p>
      <div class="color-swatches">
        ${(h.colors || []).map(c => `<div class="swatch" style="background:${esc(c)}" title="${esc(c)}"></div>`).join('')}

      <!-- 3. KİLİT FİGÜRLER (.cc GRID YAPISI) -->

          ? `${esc(h.name)} hanedanının kaderini tayin eden, savaşlarda ve saray meclislerinde öne çıkan şahsiyetler:`

      ${members.length ? `
      <div class="cc-grid" id="house-figures-grid">

      <!-- 4. TARİHÇE & KRONİKLER -->

      <p class="art-p" style="font-size:.86rem;color:var(--parchd);margin-bottom:.5rem">
        ${l === 'tr'
          ? 'Evren Ansiklopedisi kayıtlarında hanenin adı geçen dönüm noktaları, fetihler ve krizler:'
          : 'Milestones, conquests and historical crises of this house recorded in the World Encyclopedia:'}
      </p>

      <div class="house-history-grid">
        ${houseEvents.length ? houseEvents.map(e => `
          <div class="house-history-card lc ${esc(e.type || '')}">
            <div>
              <div class="hh-head">
                <span class="hh-ks">KS ${esc(e.ks)}</span>
                <span class="hh-type">${esc(typeLabels[e.type] || e.type)}</span>
              </div>
              <h4 class="hh-title">${esc(t(e.name))}</h4>
              ${e.ruler ? `<div class="hh-ruler">${l === 'tr' ? 'Lider / Hükümdar: ' : 'Ruler / Leader: '} ${esc(e.ruler)}</div>` : ''}
              <p class="hh-desc">${esc(t(e.desc))}</p>
            </div>
            <a href="lore.html#/evren/${esc(e.id || '')}" class="hh-link">
              <span>${l === 'tr' ? 'Kronikte Gör' : 'View in Chronicle'}</span>
              <span>→</span>
            </a>
          </div>
        `).join('') : `
          <div class="house-history-card lc" style="grid-column:1/-1">
            <div class="hh-head">
              <span class="hh-ks">KS ~1144</span>
              <span class="hh-type">${l === 'tr' ? 'Arşiv Kaydı' : 'Archive Record'}</span>
            </div>
            <h4 class="hh-title">${esc(h.name)} — ${l === 'tr' ? 'Hane Kökeni' : 'House Roots'}</h4>
            <p class="hh-desc">${esc(t(h.origin) || t(h.desc) || '')}</p>
            <a href="lore.html#/evren/tarih" class="hh-link">

      <!-- 5. İLGİLİ BÖLÜMLER -->
      <h2 class="art-h2" id="bolumler">${l === 'tr' ? 'İlgili Bölümler & Edebi Kayıtlar' : 'Related Chapters & Literary Records'}</h2>
      <p class="art-p" style="font-size:.86rem;color:var(--parchd);margin-bottom:.5rem">
        ${l === 'tr'
          ? 'Bu hanenin üyelerinin doğrudan bakış açısı (POV) sunduğu veya olayların merkezinde yer aldığı kitap bölümleri:'
          : 'Novel chapters where members of this house feature as POV characters or central actors:'}
      </p>

      <div class="house-chapters-grid">
        ${relatedChapters.length ? relatedChapters.map(ch => `
          <a class="house-chapter-card" href="${SWRoute.href('bolum', ch.id)}">
            <div>
              <div class="hch-head">
                <span class="hch-num">${l === 'tr' ? 'Bölüm ' : 'Chapter '} ${esc(ch.num || ch.id)}</span>

              </div>
              <h4 class="hch-title">${esc(t(ch.title))}</h4>

              <span>→</span>

          <div style="background:var(--surface);border:1px dashed var(--border);padding:1.5rem;text-align:center;color:var(--parchd);font-style:italic;grid-column:1/-1">
            ${l === 'tr' ? 'Bu hanenin şahsiyetleri henüz açılan ilk cilt bölümlerinde doğrudan odak noktası olmamıştır; gelecek fasıllarda yer alacaktır.' : 'Figures from this house have not yet been the primary POV focus in the first published volume.'}
          </div>
        `}
      </div>

      <!-- 6. EVREN ANSİKLOPEDİSİ KÖPRÜLERİ -->
      <h2 class="art-h2" id="ansiklopedi">${l === 'tr' ? 'Evren Ansiklopedisi Bağlantısı' : 'World Encyclopedia Links'}</h2>
      <div class="house-lore-links">
        <a href="lore.html#/evren/yer-${yerSlug(t(prov.name))}" class="house-lore-link-card">
          <span class="hl-icon">🗺️</span>
          <div>
            <div class="hl-title">${esc(t(prov.name))}</div>
            <div class="hl-sub">${l === 'tr' ? 'Coğrafya & Eyalet Rehberi' : 'Geography & Province Guide'}</div>
          </div>
        </a>
        <a href="lore.html#/evren/dunya" class="house-lore-link-card">
          <span class="hl-icon">🏛️</span>
          <div>
            <div class="hl-title">${l === 'tr' ? 'Dünya Güç Sıralaması' : 'World Power Ranking'}</div>
            <div class="hl-sub">${l === 'tr' ? 'Askerî & Nüfus Dengesi' : 'Military & Population Balance'}</div>
          </div>
        </a>
        <a href="lore.html#/evren/din" class="house-lore-link-card">
          <span class="hl-icon">⚖️</span>
          <div>
            <div class="hl-title">${l === 'tr' ? 'Denge Konseyi & Din' : 'Council of Balance & Faith'}</div>
            <div class="hl-sub">${l === 'tr' ? 'İmparatorluk Teolojisi' : 'Imperial Theology'}</div>
          </div>
        </a>
        <a href="harita.html#/harita/imparatorluk/${yerSlug(t(prov.name))}" class="house-lore-link-card">
          <span class="hl-icon">🧭</span>
          <div>
            <div class="hl-title">${l === 'tr' ? 'Siyasi Harita' : 'Political Map'}</div>
            <div class="hl-sub">${esc(t(prov.name))} ${l === 'tr' ? 'Konumu' : 'Location'}</div>
          </div>
        </a>
      </div>
    </div>`;

  const sideHTML = `
    <div class="hib">
      <div class="hib-head">
        <div class="hib-tier">${esc((TIER_LABEL[h.tier] || TIER_LABEL.minor)[l])}</div>
      </div>
      <div class="hib-rows">
        <div class="hib-row"><span class="hib-k">${l === 'tr' ? 'Eyalet' : 'Province'}</span><span class="hib-v"><a href="haneler.html">${esc(t(prov.name))}</a></span></div>
        <div class="hib-row"><span class="hib-k">${l === 'tr' ? 'Anlam' : 'Meaning'}</span><span class="hib-v">${esc(t(h.meaning))}</span></div>
        <div class="hib-row"><span class="hib-k">${l === 'tr' ? 'Sembol' : 'Symbol'}</span><span class="hib-v">${esc(t(h.symbol))}</span></div>
        ${t(h.motto) ? `<div class="hib-row"><span class="hib-k">${l === 'tr' ? 'Motto' : 'Motto'}</span><span class="hib-v">"${esc(t(h.motto))}"</span></div>` : ''}
        <div class="hib-row"><span class="hib-k">${l === 'tr' ? 'Kilit Figürler' : 'Key Figures'}</span><span class="hib-v">${members.length}</span></div>
        <div class="hib-row"><span class="hib-k">${l === 'tr' ? 'Kronik Olayı' : 'Events'}</span><span class="hib-v">${houseEvents.length}</span></div>
        <div class="hib-row"><span class="hib-k">${l === 'tr' ? 'Geçtiği Bölüm' : 'Chapters'}</span><span class="hib-v">${relatedChapters.length}</span></div>
      </div>
    </div>`;

  document.getElementById('content-main').innerHTML = mainHTML;
  document.getElementById('content-side').innerHTML = sideHTML;
  Wiki.Tooltip.scan(document.getElementById('content-main'));

  /* Bayrak yüklendiğinde parıltı (glow), yolu bozuksa kırık ikon yerine yer tutucu */
  const bi = document.querySelector('#content-main img.hc-banner-img');
  if (bi) {
    const frame = bi.closest('.hcb-flag-frame');
    const onImgReady = () => {
      if (frame) frame.classList.add('hcb-loaded');
    };
    if (bi.complete && bi.naturalHeight !== 0) {
      onImgReady();
    } else {
      bi.addEventListener('load', onImgReady, { once: true });
    }
    bi.addEventListener('error', () => {
      const holder = document.createElement('div');
      holder.innerHTML = bannerPlaceholder(l, h.name, true);
      if (frame) frame.replaceWith(holder.firstChild);
    }, { once: true });
  }
}

function bannerPlaceholder(l, name, failed) {
  const msg = failed
    ? (l === 'tr' ? 'Bayrak görseli yüklenemedi' : 'Banner image failed to load')
    : (l === 'tr' ? 'Bayrak henüz yüklenmemiş' : 'Flag not yet uploaded');
  return `<div class="hcb-ph"><span class="hcb-ph-glyph">${esc((name || '?').trim()[0] || '?')}</span><span>${msg}</span></div>`;
}

/* Sancak Paylaşımı (Native Share API) */
async function triggerHouseShare(btn) {
  const metaTitle = document.querySelector('meta[property="og:title"]')?.getAttribute('content')
    || document.querySelector('meta[name="twitter:title"]')?.getAttribute('content')
    || document.title;
  const metaText = document.querySelector('meta[name="description"]')?.getAttribute('content')
    || document.querySelector('meta[property="og:description"]')?.getAttribute('content')
    || '';
  const metaUrl = window.location.href;

  const shareData = {
    title: metaTitle,
    text: metaText,
    url: metaUrl
  };

  const l = Lang.get();

  if (navigator.share && (!navigator.canShare || navigator.canShare(shareData))) {
    try {
      await navigator.share(shareData);
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.warn('Native share error, falling back:', err);
    }
  }

  // Fallback: Linki panoya kopyala
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(metaUrl);
      if (btn) {
        const orig = btn.innerHTML;
        btn.classList.add('hcb-copied');
        btn.innerHTML = `
          <svg class="hcb-share-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span class="hcb-share-text">${l === 'tr' ? 'Kopyalandı' : 'Copied'}</span>
        `;
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.classList.remove('hcb-copied');
        }, 2200);
      }
    } catch (clipErr) {
      console.warn('Clipboard write error:', clipErr);
    }
  }
}

/* Bayrağa tıklayınca tam ekran ve Paylaş buton kontrolü */
document.addEventListener('click', e => {
  const shareBtn = e.target.closest && e.target.closest('.hcb-share-btn');
  if (shareBtn) {
    e.preventDefault();
    e.stopPropagation();
    triggerHouseShare(shareBtn);
    return;
  }
  const im = e.target.closest && e.target.closest('img[data-zoom]');
  if (!im) return;
  const lb = document.createElement('div');
  lb.style.cssText = 'position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:2rem;cursor:zoom-out';
  const big = document.createElement('img');
  big.src = im.src; big.alt = im.alt || '';
  big.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.6)';
  lb.appendChild(big);
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = ev => { if (ev.key === 'Escape') close(); };
  lb.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(lb);
});

SWRoute.canonicalize();
SWRoute.watch();
initWiki({ onLangChange: render });
init();
</script>
