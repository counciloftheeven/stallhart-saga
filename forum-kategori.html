<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title data-tr="Kurultay · Stallhart Wiki" data-en="The Kurultay · Stallhart Wiki">Kurultay · Stallhart Wiki</title>
<meta name="description" content="Stallhart Destanı Kurultay — kategori bazlı konu listesi." data-tr="Stallhart Destanı Kurultay — kategori bazlı konu listesi." data-en="The Stallhart Saga Kurultay — threads by category." data-i18n-attr="content">
<meta name="theme-color" content="#0c121f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Stallhart Saga">
<meta property="og:locale" content="tr_TR" data-tr="tr_TR" data-en="en_US" data-i18n-attr="content">
<meta property="og:title" content="Kurultay · Stallhart Wiki">
<meta property="og:description" content="Stallhart Destanı Kurultay — kategori bazlı konu listesi.">
<meta property="og:image" content="assets/images/logo-stallhart.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kurultay · Stallhart Wiki">
<meta name="twitter:description" content="Stallhart Destanı Kurultay — kategori bazlı konu listesi.">
<meta name="twitter:image" content="assets/images/logo-stallhart.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Modern+Antiqua&family=IM+Fell+English:ital@0;1&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="assets/css/styles.css?v=3.0">
<link rel="stylesheet" href="assets/css/kurultay.css?v=3.0">
<style>#frk-sec { background: var(--bg); }</style>
<script src="assets/js/router.js?v=3.0"></script>
</head>
<body>

<section id="frk-sec">
  <div class="page-hero">
    <p class="page-hero-eye" id="l-eye">Kurultay</p>
    <h1 class="page-hero-title" id="page-title">…</h1>
    <p class="page-hero-sub" id="page-sub"></p>
  </div>

  <div class="inn" style="padding:2.5rem 2rem 6rem">
    <nav class="fr-crumb" aria-label="Breadcrumb">
      <a href="index.html" id="l-crumb-root" data-tr="Ana Sayfa" data-en="Home">Ana Sayfa</a>
      <span>›</span>
      <a href="forum.html" id="l-crumb-home" data-tr="Kurultay" data-en="Forum">Kurultay</a>
      <span>›</span>
      <strong id="l-crumb-cur">…</strong>
    </nav>

    <div class="fr-toolbar">
      <div class="fr-toolbar-l">
        <div class="fr-search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
          <input type="search" id="fr-search" placeholder="Bu kategoride ara…" autocomplete="off">
        </div>
        <select class="fr-sort" id="fr-sort">
          <option value="yeni" data-tr="En yeni" data-en="Newest">En yeni</option>
          <option value="cevap" data-tr="En çok cevap" data-en="Most replies">En çok cevap</option>
          <option value="goruntulenme" data-tr="En çok görüntülenme" data-en="Most viewed">En çok görüntülenme</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <div id="fr-notif-slot"></div>
        <button class="btn-g fr-newbtn" type="button" id="fr-new-btn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span id="l-new">Yeni Konu Aç</span>
        </button>
      </div>
    </div>

    <!-- Alt Filtreler (Kehanet, Anket, Spoiler) -->
    <div class="fr-filter-pills" id="fr-sub-filters">
      <button class="fr-fp-btn active" data-type="all" data-tr="Tüm Konular" data-en="All Threads">Tüm Konular</button>
      <button class="fr-fp-btn" data-type="canon" data-tr="🔮 Doğrulanan Kehanetler" data-en="🔮 Canonized Theories">🔮 Doğrulanan Kehanetler</button>
      <button class="fr-fp-btn" data-type="poll" data-tr="📊 Anketli Konular" data-en="📊 Polls">📊 Anketli Konular</button>
      <button class="fr-fp-btn" data-type="no_spoiler" data-tr="👁️ Spoilersiz" data-en="👁️ No Spoilers">👁️ Spoilersiz</button>
    </div>

    <div id="fr-ch-bridge-banner" hidden style="margin-bottom:1.25rem;padding:.9rem 1.25rem;background:radial-gradient(ellipse at 50% 0%,rgba(139,30,30,.2),rgba(14,18,28,.95));border:1px solid var(--goldd);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:.65rem">
        <span style="font-size:1.3rem">📖</span>
        <span id="fr-ch-bridge-text" style="font-family:var(--font-display);color:var(--parchl);font-size:.9rem"></span>
      </div>
      <a href="forum-kategori.html?kat=bolum" style="font-size:.8rem;color:var(--gold);text-decoration:none">✕ Tüm Bölümleri Göster</a>
    </div>

    <div class="ft-list" id="ft-list"><p style="padding:1.2rem;color:var(--parchd);font-style:italic">Yükleniyor…</p></div>
    <div class="fr-pager" id="fr-pager"></div>
  </div>
</section>

<script src="assets/js/config.js?v=3.0"></script>
<script src="assets/js/patches.js?v=3.0"></script>
<script src="assets/js/wiki.js?v=3.0"></script>
<script src="assets/js/community.js?v=3.0"></script>
<script src="assets/js/kurultay.js?v=3.0"></script>
<script>
const { Lang, initWiki, esc } = Wiki;
const K = Kurultay;
const PAGE_SIZE = 20;

const params = new URLSearchParams(location.search);
const catId = params.get('kat') || '';
const chParam = params.get('ch') || '';
let cat = null, page = 0, totalCount = 0;
let activeFilter = 'all';

async function render() {
  const l = Lang.get();
  const q = document.getElementById('fr-search').value.trim();
  const sort = document.getElementById('fr-sort').value;
  
  // Bildirimler Kadehi
  const notifSlot = document.getElementById('fr-notif-slot');
  if (notifSlot && K.Notifications && K.Notifications.renderDropdown) {
    K.Notifications.renderDropdown(notifSlot, l);
  }

  // Bölüm Köprüsü Başlığı
  const chBanner = document.getElementById('fr-ch-bridge-banner');
  const chText = document.getElementById('fr-ch-bridge-text');
  if (chParam && chBanner && chText) {
    chBanner.hidden = false;
    chText.textContent = l === 'tr'
      ? `Bölüm ${chParam} okumasından geldiniz — bu bölüme ait meclis tahlilleri listeleniyor.`
      : `Arrived from Chapter ${chParam} — showing critiques and theories for this chapter.`;
  }

  const effectiveSearch = q || (chParam ? (chParam + '. Bölüm') : '');

  const res = await K.fetchThreads({
    categoryId: catId,
    search: effectiveSearch,
    sort,
    page,
    pageSize: PAGE_SIZE,
    canonOnly: activeFilter === 'canon',
    pollOnly: activeFilter === 'poll',
    noSpoiler: activeFilter === 'no_spoiler'
  });
  totalCount = typeof res.count === 'number' ? res.count : res.rows.length;

  document.getElementById('ft-list').innerHTML = res.rows.length
    ? res.rows.map(t => K.threadRowHTML(t, l, { showCat: false })).join('')
    : `<p style="padding:1.5rem;text-align:center;color:var(--parchd);font-style:italic;font-size:.85rem">${l === 'tr' ? 'Bu filtrelere uygun müzakere bulunamadı. İlk konuyu sen aç!' : 'No threads match this filter. Start the first one!'}</p>`;

  const pager = document.getElementById('fr-pager');
  const hasMore = res.rows.length === PAGE_SIZE;
  if (page === 0 && !hasMore) { pager.innerHTML = ''; }
  else {
    pager.innerHTML = `
      <button id="fr-prev" ${page === 0 ? 'disabled' : ''}>${l === 'tr' ? '‹ Önceki' : '‹ Prev'}</button>
      <span>${l === 'tr' ? 'Sayfa' : 'Page'} ${page + 1}</span>
      <button id="fr-next" ${hasMore ? '' : 'disabled'}>${l === 'tr' ? 'Sonraki ›' : 'Next ›'}</button>`;
    document.getElementById('fr-prev').addEventListener('click', () => { page--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    document.getElementById('fr-next').addEventListener('click', () => { page++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  }
}

function openNewThreadModal() {
  const l = Lang.get();
  if (cat && cat.is_locked && Wiki.Community && Wiki.Community.getState && !Wiki.Community.getState().isAdmin) {
    if (Wiki.Community.util && Wiki.Community.util.toast) Wiki.Community.util.toast(l === 'tr' ? 'Bu kategoride yalnızca yönetim konu açabilir.' : 'Only staff can post in this category.', true);
    else alert(l === 'tr' ? 'Bu kategoride yalnızca yönetim konu açabilir.' : 'Only staff can post in this category.');
    return;
  }
  const defaultTitle = chParam ? `${chParam}. Bölüm Tahlili: ` : '';
  const modalHtml = `
    <h2 class="sw-h" style="font-family:var(--font-display);color:var(--parchl);border-bottom:1px solid rgba(196,150,42,.3);padding-bottom:.5rem">⚔ ${l === 'tr' ? 'Yeni Konu Aç' : 'New Thread'}</h2>
    <p class="sw-sub" style="color:var(--parchd);font-style:italic;margin-top:.4rem">${esc(K.catLabel(cat, l))}</p>
    <form class="sw-form" id="fr-nt-form" style="margin-top:1.25rem">
      <label class="sw-l"><span>${l === 'tr' ? 'Başlık' : 'Title'}</span>
        <input class="sw-in" name="title" maxlength="140" required value="${esc(defaultTitle)}" placeholder="${l === 'tr' ? 'Konu başlığını yazın...' : 'Enter topic title...'}" style="background:rgba(8,12,19,.9);border:1px solid var(--border);color:var(--parchl);padding:.5rem"></label>
      <label class="sw-l" style="margin-top:.8rem">
        <span>${l === 'tr' ? 'İçerik & Gözlemler' : 'Body & Observations'}</span>
        <div id="fr-cat-tb-slot"></div>
        <textarea class="sw-in" id="fr-cat-nt-body" data-body name="body" maxlength="8000" rows="6" required placeholder="${l === 'tr' ? 'Düşüncelerinizi, alıntıları veya teorinizi buraya yazın...' : 'Write your post here...'}" style="background:rgba(8,12,19,.9);border:1px solid var(--border);color:var(--parchl);padding:.6rem;line-height:1.7"></textarea>
      </label>
      <p class="sw-err" id="fr-nt-err" hidden style="color:var(--bloodb);margin-top:.6rem"></p>
      <div class="sw-actions" style="margin-top:1.4rem;display:flex;justify-content:flex-end;gap:.8rem">
        <button type="button" class="sw-btn" data-close>${l === 'tr' ? 'Vazgeç' : 'Cancel'}</button>
        <button type="submit" class="sw-btn primary" style="background:linear-gradient(135deg,rgba(139,30,30,.9),rgba(196,150,42,.85));border-color:var(--gold);color:#fff">${l === 'tr' ? 'Konuyu Aç' : 'Post Thread'}</button>
      </div>
    </form>`;

  let rec = null;
  if (Wiki.Community && Wiki.Community.util && Wiki.Community.util.Modal && Wiki.Community.util.Modal.open) {
    rec = Wiki.Community.util.Modal.open({
      title: l === 'tr' ? 'Yeni Konu Aç' : 'New Thread', cls: 'sw-suggest fr-newform',
      html: modalHtml
    });
  } else {
    const back = document.createElement('div');
    back.className = 'sw-modal-back';
    back.innerHTML = `<div class="sw-modal sw-suggest fr-newform"><button type="button" class="sw-x" data-close>✕</button><div class="sw-modal-body">${modalHtml}</div></div>`;
    document.body.appendChild(back);
    rec = { close: () => back.remove(), body: back.querySelector('.sw-modal-body') };
    back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) rec.close(); });
  }

  // Editör araç çubuğu
  const tbSlot = rec.body.querySelector('#fr-cat-tb-slot');
  const tbTextarea = rec.body.querySelector('#fr-cat-nt-body');
  if (tbSlot && tbTextarea && K.attachEditorToolbar) {
    K.attachEditorToolbar(tbTextarea, tbSlot, l);
  }

  rec.body.querySelector('#fr-nt-form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, err = rec.body.querySelector('#fr-nt-err');
    const title = f.title.value.trim(), body = f.body.value.trim();
    if (title.length < 4) { err.hidden = false; err.textContent = l === 'tr' ? 'Başlık en az 4 karakter olmalı.' : 'Title must be at least 4 characters.'; return; }
    f.querySelectorAll('input,select,textarea,button').forEach(el => el.disabled = true);
    try {
      const thread = await K.createThread(catId, title, body, { isCanon: catId === 'teori' && title.toLowerCase().includes('kehanet') });
      rec.close();
      if (thread && thread.id && !thread.id.startsWith('local-')) {
        location.href = 'forum-konu.html?id=' + encodeURIComponent(thread.id);
      } else {
        render();
      }
    } catch (ex) {
      err.hidden = false; err.textContent = ex.message || (l === 'tr' ? 'Bir şeyler ters gitti.' : 'Something went wrong.');
      f.querySelectorAll('input,select,textarea,button').forEach(el => el.disabled = false);
    }
  });
}

function applyLang(l) {
  document.documentElement.lang = l;
  document.getElementById('page-title').textContent = cat ? K.catLabel(cat, l) : '—';
  document.getElementById('page-sub').textContent = cat ? (l === 'tr' ? cat.desc_tr : cat.desc_en) : '';
  const rootCrumb = document.getElementById('l-crumb-root');
  if (rootCrumb) rootCrumb.textContent = l === 'tr' ? 'Ana Sayfa' : 'Home';
  document.getElementById('l-crumb-home').textContent = l === 'tr' ? 'Kurultay' : 'Forum';
  document.getElementById('l-crumb-cur').textContent = cat ? K.catLabel(cat, l) : '';
  document.getElementById('l-new').textContent = l === 'tr' ? 'Yeni Konu Aç' : 'New Thread';
  document.getElementById('fr-search').placeholder = l === 'tr' ? 'Bu kategoride ara…' : 'Search this category…';
  render();
}

let searchT;
document.getElementById('fr-search').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(() => { page = 0; render(); }, 250); });
document.getElementById('fr-sort').addEventListener('change', () => { page = 0; render(); });
document.getElementById('fr-new-btn').addEventListener('click', openNewThreadModal);

document.getElementById('fr-sub-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-type]');
  if (!btn) return;
  document.querySelectorAll('#fr-sub-filters [data-type]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.getAttribute('data-type');
  page = 0;
  render();
});

(async function boot() {
  const cats = await K.fetchCategories();
  cat = K.catById(catId) || cats.find(c => c.id === catId) || null;
  if (!cat) {
    const l0 = Lang.get();
    document.getElementById('frk-sec').innerHTML = `<div class="page-hero"><h1 class="page-hero-title">404</h1><p class="page-hero-sub">${l0 === 'tr' ? 'Kategori bulunamadı.' : 'Category not found.'} <a href="forum.html" style="color:var(--gold)">${l0 === 'tr' ? "Kurultay'a dön" : 'Back to the Kurultay'}</a>.</p></div>`;
    initWiki({}); return;
  }
  initWiki({ onLangChange: applyLang });
  applyLang(Lang.get());
})();
</script>
</body>
</html>
