<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060402;--deep:#0d0804;--surface:#110b05;
  --border:#3D2A14;--borderl:#5C3F1E;
  --gold:#C4962A;--goldb:#E8B84B;--goldd:#7A5C18;
  --parch:#D4C0A0;--parchl:#F0E6C8;--parchd:#9A8870;
  --bloodb:#8B2A2A;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--parch);font-family:'Libre Baskerville',Georgia,serif;font-size:16px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--deep)}::-webkit-scrollbar-thumb{background:var(--border)}

/* NAV */
nav{flex-shrink:0;background:rgba(4,2,1,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:200}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:54px;gap:1rem}
.nav-brand{font-family:'IM Fell English',serif;font-size:1.1rem;color:var(--gold);text-decoration:none;flex-shrink:0}
.nav-links{display:flex;gap:1.4rem;list-style:none;flex:1;justify-content:center}
.nav-links a{font-family:'IM Fell English',serif;font-size:.88rem;color:var(--parchd);text-decoration:none;transition:color .18s}
.nav-links a:hover,.nav-links a.cur{color:var(--gold)}
.nav-r{display:flex;align-items:center;flex-shrink:0}
.lang-btn{font-family:'IM Fell English',serif;font-size:.8rem;color:var(--parchd);background:none;border:1px solid var(--border);padding:.28rem .65rem;cursor:pointer;transition:.18s}
.lang-btn:hover{border-color:var(--goldd);color:var(--gold)}
.nav-ham{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px;flex-shrink:0}
.nav-ham span{display:block;width:22px;height:1.5px;background:var(--parchd)}
@media(max-width:700px){.nav-links{display:none;flex-direction:column;position:absolute;top:54px;left:0;right:0;background:rgba(4,2,1,.97);border-bottom:1px solid var(--border);padding:1rem 2rem;gap:.9rem;z-index:199}.nav-links.open{display:flex}.nav-ham{display:flex}}

/* TREE LAYOUT */
.tree-outer{flex:1;overflow:auto;position:relative;cursor:grab}
.tree-outer.drag{cursor:grabbing}
.tree-inner{min-width:1140px;min-height:740px;position:relative;display:flex;align-items:center;justify-content:center;padding:1rem}
#tree-svg{display:block;user-select:none}

/* SVG node styles */
.fn{cursor:pointer}
.fn rect{transition:filter .2s,stroke-width .18s}
.fn:hover rect,.fn.active rect{filter:brightness(1.5)}
.fn.active rect{stroke-width:2.5!important}
.fn-hist rect{fill:rgba(12,8,4,.8);stroke:rgba(61,42,20,.7);stroke-width:1.5}
.fn-dec rect{fill:rgba(36,18,18,.8);stroke:rgba(100,48,48,.7);stroke-width:1.5}
.fn-alive rect{fill:rgba(20,14,6,.8);stroke:rgba(112,82,18,.7);stroke-width:1.5}
.fn-star rect{fill:rgba(28,18,4,.9);stroke:#C4962A;stroke-width:2}
.fn-spouse rect{fill:rgba(14,10,6,.7);stroke:rgba(61,42,20,.5);stroke-width:1;stroke-dasharray:4 3}
.node-name{font-family:'IM Fell English',serif;font-size:12.5px;fill:#F0E6C8}
.node-sub{font-family:'IM Fell English',serif;font-style:italic;font-size:10px;fill:#9A8870}
.node-ks{font-family:'IM Fell English',serif;font-size:9.5px;fill:#7A5C18}
.fn-star .node-name{fill:#E8B84B}
.fn-star .node-sub{fill:#C4962A}
.fl{stroke:#3D2A14;stroke-width:1.5;fill:none}
.fl-dash{stroke:#3D2A14;stroke-width:1;fill:none;stroke-dasharray:5 4;opacity:.6}
.ml{stroke:#7A5C18;stroke-width:1.5;fill:none}
.msym{fill:var(--bg);stroke:#7A5C18;stroke-width:1.5}
.chain-anno{font-family:'IM Fell English',serif;font-style:italic;font-size:10.5px;fill:#5C3F1E}
.legend-text{font-family:'IM Fell English',serif;font-style:italic;font-size:10px;fill:#5C3F1E}
.tree-title{font-family:'IM Fell English',serif;font-style:italic;font-size:11px;fill:#5C3F1E;letter-spacing:3px}

/* INFO PANEL */
.ipanel{position:fixed;right:0;top:54px;bottom:0;width:280px;background:rgba(8,5,2,.97);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .28s ease;z-index:100;overflow-y:auto;backdrop-filter:blur(8px)}
.ipanel.open{transform:translateX(0)}
.ip-close{position:absolute;top:.9rem;right:1rem;background:none;border:none;color:var(--parchd);cursor:pointer;font-family:'IM Fell English',serif;font-size:1.2rem;transition:color .18s;z-index:10}
.ip-close:hover{color:var(--gold)}
.ip-body{padding:2rem 1.5rem 2rem}
.ip-eye{font-family:'IM Fell English',serif;font-size:.65rem;letter-spacing:.15em;color:var(--goldd);margin-bottom:.4rem;font-style:italic}
.ip-name{font-family:'IM Fell English',serif;font-size:1.5rem;color:var(--parchl);line-height:1.15;margin-bottom:.25rem}
.ip-title{font-size:.82rem;font-style:italic;color:var(--gold);margin-bottom:1rem}
.ip-rule{width:60px;height:1px;background:linear-gradient(to right,var(--goldd),transparent);margin-bottom:1rem}
.ip-sl{font-family:'IM Fell English',serif;font-size:.63rem;letter-spacing:.12em;color:var(--goldd);margin-bottom:.35rem}
.ip-val{font-size:.82rem;color:var(--parchd);line-height:1.72;font-style:italic;margin-bottom:1rem}
.ip-epi{font-family:'IM Fell English',serif;font-style:italic;font-size:.75rem;color:var(--bloodb);padding-top:.75rem;border-top:1px solid var(--border)}
.ip-ks{display:inline-block;font-family:'IM Fell English',serif;font-size:.68rem;border:1px solid var(--border);padding:.15rem .55rem;color:var(--goldd);font-style:italic;margin-bottom:1rem}
.ip-link{display:block;font-family:'IM Fell English',serif;font-size:.75rem;color:var(--gold);font-style:italic;text-decoration:none;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)}
.ip-link:hover{color:var(--goldb)}

/* TOOLBAR */
.toolbar{position:fixed;bottom:2rem;left:2rem;z-index:50;display:flex;gap:.4rem}
.tb{width:34px;height:34px;background:rgba(13,8,4,.92);border:1px solid var(--border);color:var(--parchd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'IM Fell English',serif;font-size:.9rem;transition:.18s;backdrop-filter:blur(4px)}
.tb:hover{border-color:var(--goldd);color:var(--gold)}
.tb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
</style>

function applyLang() {
  document.getElementById('r').lang=L;
  document.getElementById('lang-btn').textContent=L==='tr'?'EN':'TR';
  const nav={home:{tr:'Ana Sayfa',en:'Home'},lore:{tr:'Evren',en:'Lore'},chars:{tr:'Karakterler',en:'Characters'},chaps:{tr:'Bölümler',en:'Chapters'},map:{tr:'Harita',en:'Map'}};

// ─── INFO PANEL ───────────────────────────────────────────
let activeNode = null;

function showInfo(id) {
  const p = PERSONS[id]; if(!p) return;
  activeNode = id;
  document.querySelectorAll('.fn').forEach(n=>n.classList.remove('active'));
  const node = document.getElementById('fn-'+id);
  if(node) node.classList.add('active');

  const statusLabel = {
    historical: {tr:'Tarihsel Figür',en:'Historical Figure'},
    deceased:   {tr:'Hayatını Kaybetti',en:'Deceased'},
    alive:      {tr:'Hayatta',en:'Alive'}
  };

  document.getElementById('ip-body').innerHTML = `
    <p class="ip-eye">${T(p.group)}</p>
    <h2 class="ip-name">${T(p.name)}</h2>
    <p class="ip-title">${T(p.title)}</p>
    <span class="ip-ks">${p.ks}</span>
    <div class="ip-rule"></div>
    <p class="ip-sl">${L==='tr'?'DURUM':'STATUS'}</p>
    <p class="ip-val">${T(statusLabel[p.status])||p.status}</p>
    <p class="ip-sl">${L==='tr'?'AÇIKLAMA':'DESCRIPTION'}</p>
    <p class="ip-val">${T(p.desc)}</p>
    ${p.epithet&&T(p.epithet)?`<p class="ip-epi">${T(p.epithet)}</p>`:''}
    ${p.link?`<a href="${p.link}" class="ip-link">→ ${L==='tr'?'Karakter Sayfasına Git':'Go to Character Page'}</a>`:''}
  `;
  document.getElementById('ipanel').classList.add('open');
}

function closeInfo() {
  document.getElementById('ipanel').classList.remove('open');
  document.querySelectorAll('.fn').forEach(n=>n.classList.remove('active'));
  activeNode = null;
}

// Click outside to close
document.getElementById('tree-outer').addEventListener('click',e=>{
  if(!e.target.closest('.fn')&&!e.target.closest('#ipanel')) closeInfo();
});

// ─── PAN (simple drag) ────────────────────────────────────
const outer = document.getElementById('tree-outer');
let isDragging=false, startX=0, startY=0, scrollL=0, scrollT=0;
outer.addEventListener('mousedown',e=>{isDragging=true;startX=e.pageX-outer.offsetLeft;startY=e.pageY-outer.offsetTop;scrollL=outer.scrollLeft;scrollT=outer.scrollTop;outer.classList.add('drag')});
window.addEventListener('mouseup',()=>{isDragging=false;outer.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(!isDragging)return;e.preventDefault();const x=e.pageX-outer.offsetLeft;const y=e.pageY-outer.offsetTop;outer.scrollLeft=scrollL-(x-startX);outer.scrollTop=scrollT-(y-startY)});
outer.addEventListener('touchstart',e=>{const t=e.touches[0];startX=t.pageX;startY=t.pageY;scrollL=outer.scrollLeft;scrollT=outer.scrollTop},{passive:true});
outer.addEventListener('touchmove',e=>{const t=e.touches[0];outer.scrollLeft=scrollL-(t.pageX-startX);outer.scrollTop=scrollT-(t.pageY-startY)},{passive:true});

function resetPan(){outer.scrollLeft=0;outer.scrollTop=0;}

// ─── NAV ──────────────────────────────────────────────────
document.getElementById('ham').addEventListener('click',()=>document.getElementById('navl').classList.toggle('open'));
document.querySelectorAll('#navl a').forEach(a=>a.addEventListener('click',()=>document.getElementById('navl').classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo();});

applyLang();
</script>
