    <div style="color:var(--parchd);font-style:italic">Yükleniyor…</div>

<!-- Divan Tartışması (yorumlar) — assets/js/community-divan.js doldurur -->
<div id="divan-mount"></div>

<script src="assets/js/config.js?v=3.2"></script>
<script src="assets/js/patches.js?v=3.2"></script>

<script>
const{Lang,loadData,initWiki,groupClass,Bookmarks,esc}=Wiki;

let allChars={}, charData=null, loreData=null;
const GROUP_LABELS={stallhart:{tr:'İmparatorluk',en:'Imperial'},arhan:{tr:'Arhan',en:'Arhan'},solgar:{tr:'Solgar',en:'Solgar'},selya:{tr:'Selya',en:'Selya'},rebel:{tr:'İsyancı',en:'Rebel'},court:{tr:'Saray',en:'Court'},arathen:{tr:'Arathen',en:'Arathen'},other:{tr:'Diğer',en:'Other'}};
const GROUP_CATS={stallhart:{tr:'Stallhart Hanedanı',en:'Stallhart Dynasty'},arhan:{tr:'Arhan Hanesi',en:'House Arhan'},solgar:{tr:'Solgar Hanesi',en:'House Solgar'},selya:{tr:'Selya Hanesi',en:'House Selya'},rebel:{tr:'İsyancılar',en:'Rebels'},court:{tr:'Saray',en:'The Court'},arathen:{tr:'Arathen',en:'Arathen'},other:{tr:'Diğer',en:'Other'}};
/* Yalnızca harita üzerinde gerçekten var olan bölge kimlikleri */
const EYALET_MAP={stallhart:'highsanjak',arhan:'galetsha',solgar:'solgar',selya:'shelia',rebel:'',court:'highsanjak',arathen:'',other:''};

/* URL'den ID al */
function getCharId(){
  return SWRoute.id('karakter')||null;
}

async function init(){
  try{
    const [cData, lData] = await Promise.all([
      loadData('characters.json'),
      loadData('lore.json')
    ]);
    charData = cData;
    loreData = lData;
    (charData.characters||[]).forEach(c=>{allChars[c.id]=c;});
    render();
  }catch(err){
    console.error('Veri yüklenemedi:',err);
    Wiki.renderError('content',err);
  }
}

function render(){
  const l=Lang.get(),t=o=>Lang.t(o),renderRich=v=>(window.Wiki&&window.Wiki.renderRichText?window.Wiki.renderRichText(v):"<p class=\"art-p\">"+esc(v)+"</p>");
  const id=getCharId();

  if(!id||!allChars[id]){
    document.getElementById('content').innerHTML=`
      <div class="not-found" style="grid-column:1/-1">
        <h2>${l==='tr'?'Karakter Bulunamadı':'Character Not Found'}</h2>
        <p>${l==='tr'?'Aradığın karakter mevcut değil.':'The character you are looking for does not exist.'}</p>
        <br><a href="karakterler.html">← ${l==='tr'?'Tüm Karakterler':'All Characters'}</a>
      </div>
      <div></div>`;
    document.title='404 · Stallhart Wiki';
    if(Wiki.Community)Wiki.Community.unmountComments('divan-mount');
    return;
  }

  const c=allChars[id];
  const isEmp=Boolean(c.emperorNumber || (c.epoch && c.characterTraits));
  const emperors = Object.values(allChars).filter(x => x.emperorNumber).sort((a,b)=>a.emperorNumber - b.emperorNumber);

  let prevEmp = null, nextEmp = null;
  if (isEmp && c.emperorNumber) {
    const curIdx = emperors.findIndex(x => x.id === c.id || x.emperorNumber === c.emperorNumber);
    if (curIdx > 0) prevEmp = emperors[curIdx - 1];
    if (curIdx >= 0 && curIdx < emperors.length - 1) nextEmp = emperors[curIdx + 1];
  }

  /* Bu hükümdara ait tarihsel olayları bul */
  let empEvents = [];
  if (loreData && loreData.events) {
    empEvents = loreData.events.filter(ev => {
      if (ev.rulerId && ev.rulerId === c.id) return true;
      if (ev.ruler && c.name?.tr) {
        const rName = ev.ruler.toLowerCase();
        const cName = c.name.tr.toLowerCase();
        if (rName.includes(cName)) return true;
        if (c.id === 'craes' && rName.includes('i. craes')) return true;
      }
      return false;
    });
  }

  const charFullTitle = isEmp 
    ? `${t(c.name)} (${c.emperorNumber}. İmparator · ${t(c.epoch)}) — Karakter Rehberi | The Stallhart Saga`
    : `${t(c.name)} (${t(c.house)}) — Karakter Rehberi | The Stallhart Saga`;
  document.title = charFullTitle;
  document.documentElement.lang=l;

  // Dinamik SEO ve OpenGraph senkronizasyonu
  try {
    const desc = `${t(c.name)}: ${isEmp ? `${c.emperorNumber}. Stallhart İmparatoru. ${t(c.epoch)}. ` : (t(c.house) ? t(c.house) + ' mensubu ' : '')}${t(c.title) ? t(c.title) + '. ' : ''}${t(c.bio || '').slice(0, 130)}... Türkçe dark fantasy karakter biyografisi.`;
    const descEl = document.querySelector('meta[name="description"]');
    if (descEl) descEl.content = desc;
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.content = charFullTitle;
    const twTitle = document.querySelector('meta[name="twitter:title"]');
    if (twTitle) twTitle.content = charFullTitle;
    const ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.content = desc;
    const twDesc = document.querySelector('meta[name="twitter:description"]');
    if (twDesc) twDesc.content = desc;
  } catch(e) {}

  /* İlgili karakterler */
  const relatedIds=[...(c.allies||[]),...(c.enemies||[])].slice(0,6);
  const relatedHTML=relatedIds.map(rid=>{
    const rc=allChars[rid];
    if(!rc)return'';
    const isEnemy=(c.enemies||[]).includes(rid);
    return`<a class="related-item" href="${SWRoute.href('karakter',rid)}">
      <div class="ri-dot" style="background:${isEnemy?'var(--bloodb)':'var(--goldd)'}"></div>
      <div><div class="ri-name">${esc(t(rc.name))}</div><div class="ri-role">${esc(t(rc.title)||t(rc.house))}</div></div>
    </a>`;
  }).join('');

  /* Yer imi */
  const isBookmarked=Bookmarks.has(id);

  /* Harita linki */
  const mapId=EYALET_MAP[c.group||''];
  const mapLink=mapId?`<br><a class="map-badge" href="${SWRoute.href('harita',mapId)}">🗺 ${l==='tr'?'Haritada gör':'See on map'}</a>`:'';

  /* İnfobox satırları */
  const houseHref = c.group ? `hane-detay.html?id=${encodeURIComponent(c.group)}` : 'haneler.html';
  const rows=[
    isEmp && c.emperorNumber ? {k:l==='tr'?'Hükümranlık':'Sovereignty', v:`<strong style="color:var(--goldb);">👑 ${c.emperorNumber}. ${l==='tr'?'İmparator':'Emperor'}</strong>`} : null,
    isEmp && t(c.epoch) ? {k:l==='tr'?'Dönem / Çağ':'Imperial Era', v:`<span style="color:var(--goldd);">${esc(t(c.epoch))}</span>`} : null,
    isEmp && t(c.reignNote) ? {k:l==='tr'?'Saltanat':'Reign', v:`<span style="font-size:.74rem;">${esc(t(c.reignNote))}</span>`} : null,
    {k:l==='tr'?'Durum':'Status',  v:`<span class="ib-dot ${c.status}"></span>${{alive:{tr:'Yaşıyor',en:'Alive'},deceased:{tr:'Hayatını Kaybetti',en:'Deceased'},historical:{tr:'Tarihsel',en:'Historical'}}[c.status]?.[l]||c.status}`},
    {k:l==='tr'?'Hane':'House',    v:`<a href="${houseHref}" style="color:var(--goldb);text-decoration:underline;">${esc(t(c.house))}</a>`},
    {k:l==='tr'?'Unvan':'Title',   v:`<a href="hiyerarsi.html" style="color:inherit;text-decoration:none;">${esc(t(c.title))}</a>`},
    {k:l==='tr'?'Doğum':'Birth',   v:esc(t(c.birth||{tr:'-',en:'-'}))},
    {k:l==='tr'?'Bağlılık':'Allegiance', v:`<a href="haneler.html#devletler" style="color:var(--goldb);">${esc(t(c.alleg||{tr:'-',en:'-'}))}</a>`},
    isEmp && empEvents.length ? {k:l==='tr'?'Hadiseler':'Events', v:`<a href="#hadiseler" style="color:var(--goldb);font-weight:600;">${empEvents.length} ${l==='tr'?'Kayıtlı Olay':'Recorded Events'}</a>`} : null,
    t(c.weapon)?{k:l==='tr'?'Silah / Eşya':'Weapon / Item', v:esc(t(c.weapon))}:null,
    c.chapters?.length?{k:l==='tr'?'Bölümler':'Chapters',v:c.chapters.map(ch=>`<a href="oku.html?ch=${encodeURIComponent(ch)}" style="color:var(--goldb);font-weight:600;">${esc(Lang.chapterTag(ch))}</a>`).join(', ')}:null
  ].filter(Boolean);

  /* Ana içerik */
  const mainHTML=`
    <div>
      <nav class="breadcrumb">
        <a href="index.html">${l==='tr'?'Ana Sayfa':'Home'}</a><span>›</span>
        <a href="karakterler.html">${l==='tr'?'Karakterler':'Characters'}</a><span>›</span>
        ${isEmp ? `<a href="karakterler.html#imparatorlar">${l==='tr'?'Stallhart İmparatorları':'Stallhart Emperors'}</a><span>›</span>` : `<a href="haneler.html">${esc(t(c.house))}</a><span>›</span>`}
        <strong style="color:var(--parchl)">${esc(t(c.name))}</strong>
      </nav>

      ${isEmp ? `
      <div class="emp-crown-badge">
        <span>👑</span>
        <span>${esc(l==='tr' ? `${c.emperorNumber}. Stallhart İmparatoru` : `Stallhart Emperor ${c.emperorNumber}`)}</span>
        <span>·</span>
        <span>${esc(t(c.epoch))}</span>
      </div>` : `<div class="art-eyebrow">${l==='tr'?'Karakter Maddesi':'Character Article'}</div>`}

      <h1 class="art-title">${esc(t(c.name))}</h1>
      <p class="art-subtitle">${t(c.epi) ? `"${esc(t(c.epi))}"` : esc(t(c.title))}</p>

      <div class="art-tags">
        <a href="haneler.html" class="art-tag major">${esc(t(c.house))}</a>
        <span class="art-tag ${c.group==='rebel'?'danger':''}">${esc(GROUP_LABELS[c.group]?Lang.t(GROUP_LABELS[c.group]):c.group)}</span>
        ${isEmp ? `<span class="art-tag" style="border-color:var(--goldd);color:var(--gold);">${esc(t(c.epoch))}</span>` : ''}
        ${(c.chapters||[]).map(ch=>`<span class="art-tag">${esc(Lang.chapterTag(ch))}</span>`).join('')}
      </div>

      <!-- Emperor Quick Jumper Bar -->
      ${isEmp && emperors.length ? `
      <div class="emp-nav-bar">
        <div class="emp-nav-header">
          <span>👑 ${l==='tr'?'Stallhart Hükümdarlar Kronolojisi (KS 1144 – 1491)':'Chronology of Stallhart Sovereigns (KS 1144 – 1491)'}</span>
          <div class="emp-nav-arrows">
            ${prevEmp ? `<a href="${SWRoute.href('karakter', prevEmp.id)}" class="emp-nav-arrow" title="${esc(t(prevEmp.name))}">← ${esc(t(prevEmp.name))}</a>` : ''}
            ${nextEmp ? `<a href="${SWRoute.href('karakter', nextEmp.id)}" class="emp-nav-arrow" title="${esc(t(nextEmp.name))}">${esc(t(nextEmp.name))} →</a>` : ''}
          </div>
        </div>
        <div class="emp-jumper-strip">
          ${emperors.map(e => `
            <a href="${SWRoute.href('karakter', e.id)}" class="emp-jump-btn ${e.id === c.id ? 'active' : ''}" title="${esc(t(e.name))} · ${esc(t(e.epoch))}">
              ${e.emperorNumber}. ${esc(t(e.name).replace(' Stallhart', ''))}
            </a>
          `).join('')}
        </div>
      </div>` : ''}

      <!-- TOC -->
      <div class="toc">
        <div class="toc-title">📜 ${l==='tr'?'İçindekiler':'Contents'}</div>
        <ul class="toc-list">
          ${t(c.quote)?`<li><a href="#soz">1. ${l==='tr'?'Tanımlayıcı Söz':'Defining Quote'}</a></li>`:''}
          ${t(c.nameMeaning)?`<li><a href="#etimoloji">${isEmp?'2. ':'1. '}${l==='tr'?'İsim Kökeni & Kutsal Anlam':'Name Origin & Sacred Etymology'}</a></li>`:''}
          ${t(c.characterTraits)?`<li><a href="#psikoloji">${isEmp?'3. ':'2. '}${l==='tr'?'Karakter & Hükümdarlık Psikolojisi':'Character & Leadership Psychology'}</a></li>`:''}
          ${t(c.physical)?`<li><a href="#fiziksel">${isEmp?'4. ':'3. '}${l==='tr'?'Fiziksel Tasvir & Alametler':'Physical Stature & Iconic Marks'}</a></li>`:''}
          ${t(c.kinship)?`<li><a href="#hanedan">${isEmp?'5. ':'4. '}${l==='tr'?'Hanedan & Soy Bağı':'Lineage & Kinship'}</a></li>`:''}
          <li><a href="#biyografi">${isEmp?'6. ':'5. '}${l==='tr'?(isEmp?'Saltanat Tarihçesi & İcraatlar':'Biyografi'):(isEmp?'Reign Chronicles & Governance':'Biography')}</a></li>
          ${empEvents.length?`<li><a href="#hadiseler">${isEmp?'7. ':'6. '}${l==='tr'?'Dönüm Noktası Tarihsel Hadiseler':'Pivotal Historical Events'}</a></li>`:''}
          ${t(c.controversies)?`<li><a href="#ihtilaflar">${isEmp?'8. ':'7. '}${l==='tr'?'İhtilaflar & Sır Kararlar':'Controversies & Dark Decrees'}</a></li>`:''}
          ${t(c.chroniclerNotes)?`<li><a href="#kronik">${isEmp?'9. ':'8. '}${l==='tr'?'Divan Başvakanüvisi Şerhleri':'Imperial Chronicler Notes'}</a></li>`:''}
          ${(c.allies||[]).length?`<li><a href="#muttefikler">${l==='tr'?'Müttefikler':'Allies'}</a></li>`:''}
          ${(c.enemies||[]).length?`<li><a href="#dusmanlar">${l==='tr'?'Düşmanlar':'Enemies'}</a></li>`:''}
          ${t(c.epi)?`<li><a href="#lakap">${l==='tr'?'Lakap':'Epithet'}</a></li>`:''}
        </ul>
      </div>

      <!-- Söz -->
      ${t(c.quote)?`<div class="art-quote" id="soz">${SWRich.inline(Lang.html(c.quote))}<cite>— ${esc(t(c.name))}</cite></div>`:''}

      <!-- İsim Kökeni & Anlamı -->
      ${t(c.nameMeaning)?`
      <div class="emp-box" id="etimoloji">
        <div class="emp-box-title">
          <span>📜</span>
          <span>${l==='tr'?'İsim Kökeni & Kutsal Anlam':'Name Origin & Sacred Etymology'}</span>
        </div>
        <div class="emp-box-text">${renderRich(t(c.nameMeaning))}</div>
      </div>`:''}

      <!-- Karakter & Hükümdarlık Psikolojisi -->
      ${t(c.characterTraits)?`
      <section class="art-sec" id="psikoloji">
        <h2 class="art-sec-head">
          <span>🧠</span>
          <span>${l==='tr'?'Karakter & Hükümdarlık Psikolojisi':'Character & Leadership Psychology'}</span>
        </h2>
        <div class="art-rich-wrap">${renderRich(t(c.characterTraits))}</div>
      </section>`:''}

      <!-- Fiziksel Tasvir & Alametler -->
      ${t(c.physical)?`
      <section class="art-sec" id="fiziksel">
        <h2 class="art-sec-head">
          <span>👁️</span>
          <span>${l==='tr'?'Fiziksel Tasvir & Alametler':'Physical Stature & Iconic Marks'}</span>
        </h2>
        <div class="emp-box" style="border-left-color:var(--gold)">
          <div class="emp-box-text">${renderRich(t(c.physical))}</div>
        </div>
      </section>`:''}

      <!-- Hanedan & Soy Bağı -->
      ${t(c.kinship)?`
      <section class="art-sec" id="hanedan">
        <h2 class="art-sec-head">
          <span>👑</span>
          <span>${l==='tr'?'Hanedan & Soy Bağı':'Lineage & Kinship'}</span>
        </h2>
        <div class="art-rich-wrap">${renderRich(t(c.kinship))}</div>
      </section>`:''}

      <!-- Saltanat Tarihçesi / Biyografi -->
      <section class="art-sec" id="biyografi">
        <h2 class="art-sec-head">
          <span>⚔️</span>
          <span>${l==='tr'?(isEmp?'Saltanat Tarihçesi & İcraatlar':'Biyografi'):(isEmp?'Reign Chronicles & Governance':'Biography')}</span>
        </h2>
        <div class="art-rich-wrap">${renderRich(Lang.html(c.bio))}</div>
      </section>

      <!-- Tarihsel Hadiseler (lore.events ile tam entegre) -->
      ${empEvents.length?`
      <section class="art-sec" id="hadiseler">
        <h2 class="art-sec-head">
          <span>📜</span>
          <span>${l==='tr'?'Dönem İçi Tarihsel Olaylar & Savaşlar':'Historical Events & Wars of the Reign'} (${empEvents.length})</span>
        </h2>
        <div class="emp-events-grid">
          ${empEvents.map(ev => `
            <a href="${SWRoute.href('olay', ev.id)}" class="emp-event-card">
              <span class="emp-event-year">${ev.ks ? (ev.ks==='?' ? (l==='tr'?'Dönem İçi':'Reign Era') : 'KS ' + ev.ks) : (l==='tr'?'Dönem İçi':'Reign')}</span>
              <div class="emp-event-info">
                <div class="emp-event-name">${esc(t(ev.name))}</div>
                <div class="emp-event-desc">${SWRich.para(Lang.html(ev.desc), '')}</div>
              </div>
              <span class="emp-event-arrow">→</span>
            </a>
          `).join('')}
        </div>
      </section>`:''}

      <!-- İhtilaflar & Sır Kararlar -->
      ${t(c.controversies)?`
      <section class="art-sec" id="ihtilaflar">
        <div class="emp-box danger">
          <div class="emp-box-title">
            <span>🔥</span>
            <span>${l==='tr'?'İhtilaflar, Kan Fermanları & Sır Kararlar':'Controversies, Blood Decrees & Secret Pacts'}</span>
          </div>
          <div class="emp-box-text">${renderRich(t(c.controversies))}</div>
        </div>
      </section>`:''}

      <!-- Divan Başvakanüvisi Şerhleri -->
      ${t(c.chroniclerNotes)?`
      <section class="art-sec" id="kronik">
        <div class="emp-box note">
          <div class="emp-box-title">
            <span>🖋️</span>
            <span>${l==='tr'?'Divan Başvakanüvisi Şerhleri & Tarih Yazımı':'Imperial Chronicler Notes & Historiography'}</span>
          </div>
          <div class="emp-box-text">${renderRich(t(c.chroniclerNotes))}</div>
        </div>
      </section>`:''}

      <!-- Müttefikler & İttifak Bağları -->
      ${(c.allies||[]).length?`
      <div class="rel-section rel-allies">
        <h2 class="art-sec-head" id="muttefikler">
          <span class="rel-head-icon ally">✦</span>
          <span>${l==='tr'?'Müttefikler & İttifak Bağları':'Allies & Pacts'}</span>
        </h2>
        <div class="rel-nodes-grid">
          ${c.allies.map(aid=>{
            const ac=allChars[aid];
            const name=ac?t(ac.name):aid;
            const house=ac?t(ac.house):'';
            const role=ac?t(ac.title):'';
            const status=ac?.status||'';
            return `
              <a href="${SWRoute.href('karakter',aid)}" class="rel-node-card rel-ally">
                <span class="rel-node-glyph" title="${l==='tr'?'İttifak Bağı':'Alliance Bond'}">✦</span>
                <div class="rel-node-info">
                  <div class="rel-node-name">
                    <span>${esc(name)}</span>
                    ${status?`<span class="rel-status-dot ${status}"></span>`:''}
                  </div>
                  ${house||role?`<div class="rel-node-meta">${esc([house,role].filter(Boolean).join(' · '))}</div>`:''}
                </div>
                <span class="rel-node-arrow">→</span>
              </a>`;
          }).join('')}
        </div>
      </div>`:''}

      <!-- Düşmanlar & Husumet Hatları -->
      ${(c.enemies||[]).length?`
      <div class="rel-section rel-enemies">
        <h2 class="art-sec-head" id="dusmanlar">
          <span class="rel-head-icon enemy">⚔</span>
          <span>${l==='tr'?'Düşmanlar & Husumet Hatları':'Enemies & Feuds'}</span>
        </h2>
        <div class="rel-nodes-grid">
          ${c.enemies.map(eid=>{
            const ec=allChars[eid];
            const name=ec?t(ec.name):eid;
            const house=ec?t(ec.house):'';
            const role=ec?t(ec.title):'';
            const status=ec?.status||'';
            return `
              <a href="${SWRoute.href('karakter',eid)}" class="rel-node-card rel-enemy">
                <span class="rel-node-glyph" title="${l==='tr'?'Husumet / Rekabet':'Hostility / Rivalry'}">⚔</span>
                <div class="rel-node-info">
                  <div class="rel-node-name">
                    <span>${esc(name)}</span>
                    ${status?`<span class="rel-status-dot ${status}"></span>`:''}
                  </div>
                  ${house||role?`<div class="rel-node-meta">${esc([house,role].filter(Boolean).join(' · '))}</div>`:''}
                </div>
                <span class="rel-node-arrow">→</span>
              </a>`;
          }).join('')}
        </div>
      </div>`:''}

      <!-- Lakap -->
      ${t(c.epi)?`
      <h2 class="art-sec-head" id="lakap">${l==='tr'?'Lakap':'Epithet'}</h2>
      <p class="art-p" style="font-style:italic;color:var(--bloodb)">"${esc(t(c.epi))}"</p>`:''}

      <!-- Kategori -->
      <div class="art-cats">
        <div class="cats-label">🏷 ${l==='tr'?'Kategoriler':'Categories'}</div>
        <div class="art-tags">
          ${isEmp ? `<span class="art-tag major">👑 ${l==='tr'?'Stallhart İmparatorları':'Stallhart Emperors'}</span>` : ''}
          ${isEmp && t(c.epoch) ? `<span class="art-tag">${esc(t(c.epoch))}</span>` : ''}
          ${c.status==='alive'?`<span class="art-tag major">${l==='tr'?'Yaşayan Karakterler':'Living Characters'}</span>`:''}
          ${c.status==='deceased'?`<span class="art-tag danger">${l==='tr'?'Hayatını Kaybedenler':'Deceased'}</span>`:''}
          <span class="art-tag">${esc(GROUP_CATS[c.group]?Lang.t(GROUP_CATS[c.group]):c.group)}</span>
          ${(c.chapters||[]).length?`<span class="art-tag">${l==='tr'?'Cilt I':'Volume I'}</span>`:''}
        </div>
      </div>
    </div>`;

  /* Sidebar */
  const sideHTML=`
    <div>
      <div class="infobox">
        <div class="ib-head">
          <div class="ib-house" style="color:var(--c-${groupClass(c.group)},var(--goldd))">${isEmp ? '👑 ' : ''}${esc(t(c.house))}</div>
          <div class="ib-name">${esc(t(c.name))}</div>
          <div class="ib-role">${isEmp ? `${c.emperorNumber}. ${l==='tr'?'İmparator':'Emperor'} · ${esc(t(c.title))}` : esc(t(c.title))}</div>
        </div>
        <div class="char-image-wrap">
          ${c.image?`<img ${Wiki.imgAttrs(c.image,'(max-width:800px) 90vw, 440px',{eager:true})} alt="${esc(t(c.name))}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}
          <div class="char-img-placeholder" style="display:${c.image?'none':'flex'}">👤</div>
        </div>
        <div class="ib-rows">
          ${rows.map(r=>`<div class="ib-row"><span class="ib-key">${r.k}</span><span class="ib-val">${r.v}</span></div>`).join('')}
        </div>
      </div>
      ${mapLink}

      ${relatedHTML?`
      <div class="related-sec">
        <div class="related-title">${l==='tr'?'İlgili Karakterler':'Related Characters'}</div>
        <div class="related-list">${relatedHTML}</div>
      </div>`:''}

      <div style="margin-top:1rem;display:flex;flex-direction:column;gap:.4rem;">
        <a href="karakterler.html" style="font-family:var(--font-display);font-style:italic;font-size:.75rem;color:var(--goldd);text-decoration:none">← ${l==='tr'?'Tüm Karakterler':'All Characters'}</a>
        ${isEmp ? `<a href="karakterler.html#imparatorlar" style="font-family:var(--font-display);font-style:italic;font-size:.75rem;color:var(--gold);text-decoration:none">👑 ${l==='tr'?'Stallhart İmparatorları Kronolojisi':'Stallhart Emperors Chronology'} →</a>` : ''}
      </div>
    </div>`;

  document.getElementById('content').innerHTML=mainHTML+sideHTML;
  Wiki.Tooltip.scan(document.getElementById('content'));
  if(Wiki.Community)Wiki.Community.mountComments('divan-mount',{type:'character',id:id,title:t(c.name)});
}

function applyLang(l){render();}

SWRoute.canonicalize();   /* ?id=zeandor → #/karakter/zeandor */
SWRoute.watch();          /* başka maddeye geçilirse sayfa yeniden yüklenir */
initWiki({onLangChange:applyLang});
init();
</script>
</body>
</html>
