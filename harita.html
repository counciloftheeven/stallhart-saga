<!DOCTYPE html>
<html lang="tr" id="r">
<head>
<meta charset="UTF-8">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060402;--deep:#0d0804;--border:#3D2A14;--borderl:#5C3F1E;
  --gold:#C4962A;--goldb:#E8B84B;--goldd:#7A5C18;
  --parch:#D4C0A0;--parchl:#F0E6C8;--parchd:#9A8870;--bloodb:#8B2A2A;
}
html,body{height:100%;overflow:hidden}
body{background:#050308;color:var(--parch);font-family:'Libre Baskerville',Georgia,serif;font-size:16px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--deep)}::-webkit-scrollbar-thumb{background:var(--border)}

nav{flex-shrink:0;background:rgba(4,2,1,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:200}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:54px;gap:1rem}
.nav-brand{font-family:'IM Fell English',serif;font-size:1.1rem;color:var(--gold);text-decoration:none;flex-shrink:0}
.nav-links{display:flex;gap:1.1rem;list-style:none;flex:1;justify-content:center}
.nav-links a{font-family:'IM Fell English',serif;font-size:.8rem;color:var(--parchd);text-decoration:none;transition:color .18s;white-space:nowrap}
.nav-links a:hover,.nav-links a.cur{color:var(--gold)}
.nav-r{display:flex;align-items:center;flex-shrink:0}
.lang-btn{font-family:'IM Fell English',serif;font-size:.8rem;color:var(--parchd);background:none;border:1px solid var(--border);padding:.28rem .65rem;cursor:pointer;transition:.18s}
.lang-btn:hover{border-color:var(--goldd);color:var(--gold)}
.nav-ham{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px;flex-shrink:0}
.nav-ham span{display:block;width:22px;height:1.5px;background:var(--parchd)}
@media(max-width:780px){.nav-links{display:none;flex-direction:column;position:absolute;top:54px;left:0;right:0;background:rgba(4,2,1,.97);border-bottom:1px solid var(--border);padding:1rem 2rem;gap:.9rem;z-index:199}.nav-links.open{display:flex}.nav-ham{display:flex}}

.map-outer{flex:1;overflow:hidden;position:relative;cursor:grab;background:#050308}
.map-outer.dragging{cursor:grabbing}
.map-inner{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.map-wrap{position:relative;display:block;line-height:0}
.map-wrap img{display:block}
.map-wrap svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:all}

.rgn{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:12;transition:fill .15s,stroke .15s}
.rgn:hover,.rgn.active{stroke:rgba(232,184,75,.5)}
.rgn[data-r="khasinia"]:hover,.rgn[data-r="khasinia"].active{fill:rgba(140,90,50,.35)}
.rgn[data-r="adamen"]:hover,.rgn[data-r="adamen"].active{fill:rgba(110,175,130,.3)}
.rgn[data-r="zela"]:hover,.rgn[data-r="zela"].active{fill:rgba(50,115,135,.32)}
.rgn[data-r="galetsha"]:hover,.rgn[data-r="galetsha"].active{fill:rgba(70,45,25,.42)}
.rgn[data-r="highsanjak"]:hover,.rgn[data-r="highsanjak"].active{fill:rgba(200,155,30,.28)}
.rgn[data-r="memanth"]:hover,.rgn[data-r="memanth"].active{fill:rgba(115,75,155,.32)}
.rgn[data-r="onneva"]:hover,.rgn[data-r="onneva"].active{fill:rgba(135,175,50,.28)}
.rgn[data-r="solgar"]:hover,.rgn[data-r="solgar"].active{fill:rgba(195,95,25,.32)}
.rgn[data-r="seltania"]:hover,.rgn[data-r="seltania"].active{fill:rgba(40,175,175,.28)}
.rgn[data-r="sanctuary"]:hover,.rgn[data-r="sanctuary"].active{fill:rgba(195,55,115,.32)}
.rgn[data-r="shelia"]:hover,.rgn[data-r="shelia"].active{fill:rgba(155,125,80,.3)}
.rgn[data-r="pilkkard"]:hover,.rgn[data-r="pilkkard"].active{fill:rgba(140,165,185,.3)}
.rgn.active{stroke:rgba(232,184,75,.75);stroke-width:18}

.map-tip{position:fixed;background:rgba(8,5,2,.95);border:1px solid var(--goldd);padding:.35rem .8rem;font-family:'IM Fell English',serif;font-size:.78rem;font-style:italic;color:var(--parchl);pointer-events:none;z-index:300;display:none;white-space:nowrap;backdrop-filter:blur(6px)}

.ipanel{position:absolute;top:0;right:0;bottom:0;width:300px;background:rgba(8,5,2,.97);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .28s ease;z-index:100;overflow-y:auto;backdrop-filter:blur(8px)}
.ipanel.open{transform:translateX(0)}
.ip-close{position:absolute;top:.9rem;right:1rem;background:none;border:none;color:var(--parchd);cursor:pointer;font-family:'IM Fell English',serif;font-size:1.3rem;z-index:10;transition:color .18s;line-height:1}
.ip-close:hover{color:var(--gold)}
.ip-body{padding:2rem 1.5rem}
.ip-eye{font-family:'IM Fell English',serif;font-size:.65rem;letter-spacing:.15em;color:var(--goldd);margin-bottom:.4rem;font-style:italic}
.ip-name{font-family:'IM Fell English',serif;font-size:1.5rem;color:var(--parchl);line-height:1.15;margin-bottom:.25rem}
.ip-cap{font-size:.82rem;font-style:italic;color:var(--gold);margin-bottom:1rem}
.ip-rule{width:60px;height:1px;background:linear-gradient(to right,var(--goldd),transparent);margin-bottom:1rem}
.ip-sl{font-family:'IM Fell English',serif;font-size:.63rem;letter-spacing:.12em;color:var(--goldd);margin-bottom:.35rem;margin-top:.9rem}
.ip-val{font-size:.82rem;color:var(--parchd);line-height:1.75;font-style:italic}
.ip-house{display:inline-block;font-family:'IM Fell English',serif;font-size:.72rem;border:1px solid var(--borderl);padding:.18rem .6rem;color:var(--parch);font-style:italic}
.ip-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.75rem}
.iptag{font-family:'IM Fell English',serif;font-size:.68rem;padding:.18rem .55rem;border:1px solid var(--border);color:var(--parchd);font-style:italic}
.ip-chars{display:flex;flex-direction:column;gap:.22rem;margin-top:.5rem}
.ip-char{font-family:'IM Fell English',serif;font-size:.74rem;font-style:italic;color:var(--parchd);padding:.2rem 0;border-bottom:1px solid rgba(61,42,20,.3)}

.toolbar{position:absolute;top:1rem;left:1rem;z-index:150;display:flex;flex-direction:column;gap:.4rem}
.tb{width:36px;height:36px;background:rgba(6,4,2,.92);border:1px solid var(--border);color:var(--parchd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'IM Fell English',serif;transition:.18s;backdrop-filter:blur(4px)}
.tb:hover{border-color:var(--goldd);color:var(--gold)}
.tb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.hint{position:absolute;top:1rem;left:50%;transform:translateX(-50%);z-index:150;font-family:'IM Fell English',serif;font-size:.7rem;font-style:italic;color:var(--parchd);background:rgba(6,4,2,.78);border:1px solid var(--border);padding:.3rem .85rem;pointer-events:none;white-space:nowrap;transition:opacity 1s;backdrop-filter:blur(4px)}
.hint.gone{opacity:0}

.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IM Fell English',serif;font-style:italic;color:var(--goldd);font-size:1rem;z-index:50;text-align:center;padding:2rem}
</style>
</head>

<script>
let L=localStorage.getItem('si-lang')||'tr';
const T=o=>(o&&o[L])||(o&&o.tr)||'';
const NAV={home:{tr:'Ana Sayfa',en:'Home'},lore:{tr:'Evren',en:'Lore'},chars:{tr:'Karakterler',en:'Characters'},chaps:{tr:'Bölümler',en:'Chapters'},map:{tr:'Harita',en:'Map'},tree:{tr:'Soy Ağacı',en:'Family Tree'},quotes:{tr:'Sözler',en:'Words'}};
function applyLang(){
  document.getElementById('r').lang=L;
  document.getElementById('lang-btn').textContent=L==='tr'?'EN':'TR';
  ['home','lore','chars','chaps','map','tree','quotes'].forEach(k=>{const el=document.getElementById('nl-'+k);if(el)el.textContent=T(NAV[k]);});
  document.getElementById('hint').textContent=L==='tr'?'Sürükle · Kaydır/Sıkıştır: zoom · Bölgeye tıkla: bilgi':'Drag · Scroll/Pinch: zoom · Click region: info';
  document.title=(L==='tr'?'Harita':'Map')+' — Son İmparator';
}
function toggleLang(){L=L==='tr'?'en':'tr';localStorage.setItem('si-lang',L);applyLang();if(activeR)showInfo(activeR);}

const REGIONS={
  khasinia:{name:{tr:'Khasinia / Khasinya',en:'Khasinia / Khasinya'},eye:{tr:'Doğu Adası',en:'Eastern Island'},capital:{tr:'Khasinya Kalesi',en:'Khasinya Fortress'},house:{tr:'Khasin Hanesi',en:'House Khasin'},desc:{tr:'I. Lun Aldris tarafından Safir Boğazı\'ndaki deniz zaferinin ardından boyun eğdirilen ada. Güçlü deniz kültürü ve tarihî isyan eğilimiyle bilinir. İmparatorluğun en zorlu eyaletlerinden biri olmayı sürdürür.',en:'The island subdued by Lun Aldris I after the Sapphire Strait naval victory. Known for strong maritime culture and historical rebellious tendencies. Remains one of the empire\'s most challenging provinces.'},tags:{tr:['Deniz Kültürü','Tarihsel İsyan','Khasin Hanesi'],en:['Maritime Culture','Historical Rebellion','House Khasin']},chars:{tr:['Yunghar Khasin — Vali'],en:['Yunghar Khasin — Governor']}},
  adamen:{name:{tr:'Adamen',en:'Adamen'},eye:{tr:'Güneybatı Eyaleti',en:'Southwestern Province'},capital:{tr:'Adamen Madenleri',en:'Adamen Mines'},house:{tr:'Saert Hanesi (Cüce Vali)',en:'House Saert (Dwarf Governor)'},desc:{tr:'İmparatorluğun en büyük maden yataklarına ev sahipliği yapan eyalet. Cüce Vali Gulwar Saert işçi haklarını savunur. İlk Anne inancının en güçlü biçimde yaşadığı topraklar; madencilerin ninnileri hâlâ çınlar.',en:'Province home to the empire\'s largest mineral deposits. Dwarf Governor Gulwar Saert advocates for miners\' rights. The land where the First Mother faith survives most strongly — in the lullabies of miners.'},tags:{tr:['Maden Yatakları','Cüce Nüfus','İlk Anne İzleri'],en:['Mineral Deposits','Dwarf Population','First Mother Traces']},chars:{tr:['Gulwar Saert — Cüce Vali'],en:['Gulwar Saert — Dwarf Governor']}},
  zela:{name:{tr:"Z'ela",en:"Z'ela"},eye:{tr:'Batı Eyaleti',en:'Western Province'},capital:{tr:'Garall Limanı',en:'Port of Garall'},house:{tr:"Çeşitli Haneler (Carvhen, Itrez...)",en:"Various Houses (Carvhen, Itrez...)"},desc:{tr:"Gümüş Yol Boğazı'nın kuzey yakasında, Garall limanıyla kıtalar arası ticaretin merkezi. Eyaletin karmaşık haneler yapısı, merkezi otoritenin zayıfladığı dönemlerde ciddi bir baskı noktasına dönüşür.",en:"On the north bank of the Silver Way Strait, with the port of Garall as the center of intercontinental trade. The province's complex house structure becomes a pressure point when central authority weakens."},tags:{tr:['Garall Limanı','Deniz Ticareti','Boğaz Kontrolü'],en:['Port of Garall','Maritime Trade','Strait Control']},chars:{tr:["Arba İtrez — Z'ela Soylusu"],en:["Arba İtrez — Z'ela Noble"]}},
  galetsha:{name:{tr:'Galetsha',en:'Galetsha'},eye:{tr:'Kuzey Eyaleti',en:'Northern Province'},capital:{tr:'Galetsha Kalesi',en:'Galetsha Fortress'},house:{tr:'Galet / Galetsha Hanesi',en:'House Galet / Galetsha'},desc:{tr:'Sarp geçitleri ve stratejik mevzileriyle kuzeyin bekçisi. Metron\'dan oğlu Wolrez\'e geçen yönetim, Arathen casusuyla ittifak kurarak Olinder Albea suikastını örgütledi — Erthan yayının fitilini ateşledi.',en:"Guardian of the north with its treacherous passes and strategic positions. Wolrez Galet allied with an Arathen spy to orchestrate Olinder Albea's assassination — igniting the Erthan arc."},tags:{tr:['Sarp Dağlar','Stratejik Geçitler','Arathen İttifakı'],en:['Rugged Mountains','Strategic Passes','Arathen Alliance']},chars:{tr:['Wolrez Galet — Galetsha Valisi','Metron Galetsha — Eski Vali (Ölü)'],en:['Wolrez Galet — Governor of Galetsha','Metron Galetsha — Former Governor (Deceased)']}},
  highsanjak:{name:{tr:'High Sanjak / Başsancak',en:'High Sanjak / Başsancak'},eye:{tr:'Başkent Eyaleti',en:'Capital Province'},capital:{tr:'Arava — İmparatorluk Başkenti ★',en:'Arava — Imperial Capital ★'},house:{tr:'Stallhart Hanedanı',en:'Stallhart Dynasty'},desc:{tr:'İmparatorluğun kalbi. Stallhart sarayının bulunduğu Arava şehri, tüm eyaletlerin bağlı olduğu siyasi odak noktasıdır. Karabıçaklar buradan yönetilir. Rones döneminde büyüyen şehir, İmloth yönetiminde derin bir çürüme yaşadı.',en:"The empire's heart. The city of Arava, seat of the Stallhart palace, is the political focal point for all provinces. The Black Claws operate from here. The city grew under Rones but fell into deep rot under Imloth."},tags:{tr:['İmparatorluk Sarayı','Arava Şehri','Karabıçaklar Merkezi','Halk Günü'],en:['Imperial Palace','City of Arava','Black Claws HQ','Day of the People']},chars:{tr:['Zeandor Stallhart — İmparator (Tahtta)','Amadon Stallhart — Eski İmparator','Edun Solgar — Sürgün Başvezir','Hilnor Wolde — Baş Danışman','Rean Certfa — Başkomutan'],en:['Zeandor Stallhart — Emperor (Throne)','Amadon Stallhart — Former Emperor','Edun Solgar — Exiled Grand Vizier','Hilnor Wolde — Chief Advisor','Rean Certfa — Supreme Commander']}},
  memanth:{name:{tr:'Memanth',en:'Memanth'},eye:{tr:'Kuzey Eyaleti',en:'Northern Province'},capital:{tr:'Craber Kalesi',en:'Craber Fortress'},house:{tr:'Sınglew Hanesi (önde gelen)',en:'House Sınglew (prominent)'},desc:{tr:'Kuzey sınır hattının kritik dayanak noktası. Craber Kalesi ve Arava Garnizonu bölgenin askerî omurgasını oluşturur. Reanloth\'un sabırlı seferlerle ilhak ettiği bu eyalet, Erthan döneminde isyanın önemli bir arenasına dönüştü.',en:"Critical anchor of the northern frontier. Craber Fortress and Arava Garrison form the military backbone. Annexed by Reanloth through patient campaigns, this province became a key arena during Erthan's rebellion."},tags:{tr:['Craber Kalesi','Arava Garnizonu','Kuzey Sınır'],en:['Craber Fortress','Arava Garrison','Northern Border']},chars:{tr:['Aertas Sınglew — Doğu Sınırı Komutanı','Rikan Berkov — Elit Birlik Komutanı','Gylas Yunghar — Garnizon Komutanı'],en:['Aertas Sınglew — Eastern Border Commander','Rikan Berkov — Elite Legion Commander','Gylas Yunghar — Garrison Commander']}},
  onneva:{name:{tr:'Onneva',en:'Onneva'},eye:{tr:'Doğu Eyaleti',en:'Eastern Province'},capital:{tr:'Onneva Limanı',en:'Port of Onneva'},house:{tr:'Onneva Hanesi',en:'House Onneva'},desc:{tr:'Gümüş Yol Boğazı\'nın güneydoğu yakasında, Todfa ve Gom Ara geçiş noktalarıyla stratejik değer taşır. Deniz kuvvetleri için kritik üs konumundadır.',en:"On the southeastern bank of the Silver Way Strait, strategically valuable with the crossing points of Todfa and Gom Ara. Serves as a critical naval base."},tags:{tr:['Todfa Geçidi','Gom Ara','Deniz Üssü'],en:['Todfa Crossing','Gom Ara','Naval Base']},chars:{tr:['Irin Onneva — Eski Yüksek Rahip (Ölü)'],en:['Irin Onneva — Former High Priest (Deceased)']}},
  solgar:{name:{tr:'Solgar',en:'Solgar'},eye:{tr:'Merkez Eyaleti',en:'Central Province'},capital:{tr:'Solgar Sarayı',en:'Solgar Palace'},house:{tr:'Solgar Hanesi (Edun Solgar)',en:'House Solgar (Edun Solgar)'},desc:{tr:'Edun Solgar\'ın Zeandor tarafından sürgün edildiği eyalet. Bataklık zenginlikleriyle bilinen bu topraklar, tarihsel olarak siyasi sürgünlerin gönderildiği yer olarak bilinir. Reun Solgar\'ın ordusu Bakırsu Vadisi\'nde burada ağır bir yenilgiye uğradı.',en:"The province to which Edun Solgar was exiled by Zeandor. Known for marsh riches, historically a destination for political exiles. Reun Solgar's army suffered a catastrophic defeat at Bakırsu Valley nearby."},tags:{tr:["Edun Solgar'ın Sürgünü",'Bataklık Zenginlikleri','Bakırsu Bozgunu'],en:["Edun Solgar's Exile",'Marsh Riches','Bakırsu Defeat']},chars:{tr:['Edun Solgar — Sürgün Başvezir','Reun Solgar — Yenilmiş Komutan'],en:['Edun Solgar — Exiled Grand Vizier','Reun Solgar — Defeated Commander']}},

  sanctuary:{name:{tr:'The Sanctuary / Sığınak',en:'The Sanctuary'},eye:{tr:'Kutsal Topraklar',en:'Sacred Lands'},capital:{tr:'Sığınak Şehri',en:'Sanctuary City'},house:{tr:'Denge Konseyi (Yönetici Otorite)',en:'Council of Balance (Governing Authority)'},desc:{tr:'İmparatorluğun en kutsal toprakları. Denge Konseyi\'nin ruhani otoritesinin merkezi olan bu bölge, tapınak kompleksleri ve kutsal törenleriyle imparatorluk üzerinde güçlü bir manevi etki kurar.',en:"The most sacred lands of the empire. The spiritual authority center of the Council of Balance, exercising powerful spiritual influence through its temple complexes and holy ceremonies."},tags:{tr:['Kutsal Alan','Denge Konseyi','Tapınak Kompleksi'],en:['Sacred Ground','Council of Balance','Temple Complex']},chars:{tr:['Ertler Serbam — Yüksek Rahip','Irin Onneva — Eski Yüksek Rahip (Ölü)'],en:['Ertler Serbam — High Priest','Irin Onneva — Former High Priest (Deceased)']}},

// PAN / ZOOM
let sc=1,tx=0,ty=0,drag=false,dx=0,dy=0,stx=0,sty=0,pinch=false,pinchD=0;
const outer=document.getElementById('outer'),inner=document.getElementById('inner');
function applyT(){inner.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function doZoom(f,cx,cy){
  const nsc=clamp(sc*f,0.1,10);
  tx=cx-(cx-tx)*(nsc/sc);ty=cy-(cy-ty)*(nsc/sc);sc=nsc;applyT();
}
function zoomBtn(f){doZoom(f,outer.clientWidth/2,outer.clientHeight/2);}
function resetView(){
  const img=document.getElementById('map-img');
  if(!img.naturalWidth)return;
  const asp=img.naturalWidth/img.naturalHeight;
  const ow=outer.clientWidth,oh=outer.clientHeight;
  let w=ow,h=ow/asp;if(h>oh){h=oh;w=oh*asp;}
  sc=w/img.naturalWidth;
  tx=(ow-img.naturalWidth*sc)/2;ty=(oh-img.naturalHeight*sc)/2;applyT();
}
outer.addEventListener('mousedown',e=>{if(e.button!==0||e.target.closest('#ipanel'))return;drag=true;dx=e.clientX;dy=e.clientY;stx=tx;sty=ty;outer.classList.add('dragging');e.preventDefault();});
window.addEventListener('mousemove',e=>{if(!drag)return;tx=stx+(e.clientX-dx);ty=sty+(e.clientY-dy);applyT();});
window.addEventListener('mouseup',()=>{drag=false;outer.classList.remove('dragging');});
outer.addEventListener('wheel',e=>{e.preventDefault();const r=outer.getBoundingClientRect();doZoom(e.deltaY>0?0.88:1.135,e.clientX-r.left,e.clientY-r.top);},{passive:false});
outer.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dx=e.touches[0].clientX;dy=e.touches[0].clientY;stx=tx;sty=ty;}else if(e.touches.length===2){drag=false;pinch=true;pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}e.preventDefault();},{passive:false});
outer.addEventListener('touchmove',e=>{if(drag&&e.touches.length===1){tx=stx+(e.touches[0].clientX-dx);ty=sty+(e.touches[0].clientY-dy);applyT();}else if(pinch&&e.touches.length===2){const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;const r=outer.getBoundingClientRect();doZoom(nd/pinchD,cx-r.left,cy-r.top);pinchD=nd;}e.preventDefault();},{passive:false});
outer.addEventListener('touchend',()=>{drag=false;pinch=false;});

// IMAGE LOAD
function onImgLoad(){
  document.getElementById('loading').style.display='none';
  const img=document.getElementById('map-img');
  img.style.width=img.naturalWidth+'px';img.style.height=img.naturalHeight+'px';
  resetView();
  setTimeout(()=>document.getElementById('hint').classList.add('gone'),4500);
}
function onImgError(){
  document.getElementById('loading').innerHTML='<div style="max-width:320px;text-align:center"><p style="color:var(--bloodb);font-style:italic;margin-bottom:.75rem">Harita görseli yüklenemedi.</p><p style="font-size:.8rem;color:var(--border);line-height:1.6">GitHub\'a yüklerken <strong style="color:var(--goldd)">SIYASI_HARITA.png</strong> dosyasını HTML dosyalarıyla aynı klasöre koyun.</p></div>';
}

// TOOLTIP
const tip=document.getElementById('tip');
document.querySelectorAll('.rgn').forEach(el=>{
  el.addEventListener('mouseenter',e=>{const r=REGIONS[el.dataset.r];if(!r)return;tip.textContent=T(r.name);tip.style.display='block';moveTip(e);});
  el.addEventListener('mousemove',e=>moveTip(e));
  el.addEventListener('mouseleave',()=>{tip.style.display='none';});
});
function moveTip(e){tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY-30)+'px';}

// INFO PANEL
let activeR=null;
document.querySelectorAll('.rgn').forEach(el=>{
  el.addEventListener('click',e=>{e.stopPropagation();showInfo(el.dataset.r);});
});
outer.addEventListener('click',e=>{if(!e.target.closest('.rgn')&&!e.target.closest('#ipanel'))closeInfo();});

function showInfo(id){
  const d=REGIONS[id];if(!d)return;
  activeR=id;
  document.querySelectorAll('.rgn').forEach(el=>el.classList.toggle('active',el.dataset.r===id));
  const chars=T(d.chars)||[];
  document.getElementById('ip-body').innerHTML=
    '<p class="ip-eye">'+T(d.eye)+'</p>'+
    '<h2 class="ip-name">'+T(d.name)+'</h2>'+
    '<p class="ip-cap">★ '+T(d.capital)+'</p>'+
    '<div class="ip-rule"></div>'+
    '<p class="ip-sl">'+(L==='tr'?'YÖNETİCİ HANE':'RULING HOUSE')+'</p>'+
    '<span class="ip-house">'+T(d.house)+'</span>'+
    '<p class="ip-sl">'+(L==='tr'?'TANIM':'DESCRIPTION')+'</p>'+
    '<p class="ip-val">'+T(d.desc)+'</p>'+
    (d.tags&&T(d.tags).length?'<p class="ip-sl">'+(L==='tr'?'ÖZELLİKLER':'FEATURES')+'</p><div class="ip-tags">'+T(d.tags).map(t=>'<span class="iptag">'+t+'</span>').join('')+'</div>':'')+
    (chars.length?'<p class="ip-sl">'+(L==='tr'?'İLGİLİ KARAKTERLER':'RELATED CHARACTERS')+'</p><div class="ip-chars">'+chars.map(c=>'<div class="ip-char">'+c+'</div>').join('')+'</div>':'');
  document.getElementById('ipanel').classList.add('open');
}
function closeInfo(){
  activeR=null;
  document.getElementById('ipanel').classList.remove('open');
  document.querySelectorAll('.rgn').forEach(el=>el.classList.remove('active'));
}

// NAV
document.getElementById('ham').addEventListener('click',()=>document.getElementById('navl').classList.toggle('open'));
document.querySelectorAll('#navl a').forEach(a=>a.addEventListener('click',()=>document.getElementById('navl').classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo();});
applyLang();
</script>
