<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060402;--deep:#0d0804;--surface:#110b05;
  --card:rgba(20,12,6,.92);--border:#3D2A14;--borderl:#5C3F1E;
  --gold:#C4962A;--goldb:#E8B84B;--goldd:#7A5C18;
  --parch:#D4C0A0;--parchl:#F0E6C8;--parchd:#9A8870;
  --blood:#5C1A1A;--bloodb:#8B2A2A;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--parch);font-family:'Libre Baskerville',Georgia,serif;font-size:16px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--deep)}::-webkit-scrollbar-thumb{background:var(--border)}

/* ── NAV ── */
nav{flex-shrink:0;background:rgba(4,2,1,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:200}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:54px;gap:1rem}
.nav-brand{font-family:'IM Fell English',serif;font-size:1.1rem;color:var(--gold);text-decoration:none;flex-shrink:0}
.nav-links{display:flex;gap:1.4rem;list-style:none;flex:1;justify-content:center}
.nav-links a{font-family:'IM Fell English',serif;font-size:.88rem;color:var(--parchd);text-decoration:none;transition:color .18s}
.nav-links a:hover,.nav-links a.cur{color:var(--gold)}
.nav-r{display:flex;align-items:center;flex-shrink:0}
.lang-btn{font-family:'IM Fell English',serif;font-size:.8rem;color:var(--parchd);background:none;border:1px solid var(--border);padding:.28rem .65rem;cursor:pointer;transition:.18s}
.lang-btn:hover{border-color:var(--goldd);color:var(--gold)}
.nav-ham{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px;flex-shrink:0}
.nav-ham span{display:block;width:22px;height:1.5px;background:var(--parchd)}
@media(max-width:700px){.nav-links{display:none;flex-direction:column;position:absolute;top:54px;left:0;right:0;background:rgba(4,2,1,.97);border-bottom:1px solid var(--border);padding:1rem 2rem;gap:.9rem;z-index:199}.nav-links.open{display:flex}.nav-ham{display:flex}}

/* ── MAP LAYOUT ── */
.map-layout{flex:1;display:grid;grid-template-columns:1fr;position:relative;overflow:hidden}

/* ── TOOLBAR ── */
.toolbar{position:absolute;top:1rem;left:1rem;z-index:100;display:flex;flex-direction:column;gap:.4rem}
.tb-btn{width:36px;height:36px;background:rgba(13,8,4,.92);border:1px solid var(--border);color:var(--parchd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'IM Fell English',serif;font-size:1.1rem;transition:.18s;backdrop-filter:blur(4px)}
.tb-btn:hover{border-color:var(--goldd);color:var(--gold)}
.tb-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb-sep{height:1px;background:var(--border);margin:.1rem 0}

/* ── LEGEND ── */
.legend{position:absolute;bottom:1rem;left:1rem;z-index:100;background:rgba(13,8,4,.92);border:1px solid var(--border);padding:.75rem 1rem;backdrop-filter:blur(4px)}
.leg-title{font-family:'IM Fell English',serif;font-size:.65rem;letter-spacing:.15em;color:var(--goldd);margin-bottom:.6rem}
.leg-item{display:flex;align-items:center;gap:.5rem;font-size:.7rem;color:var(--parchd);margin-bottom:.35rem;font-style:italic}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-line{width:18px;height:2px;flex-shrink:0}

/* ── MAP CONTAINER ── */
.map-container{width:100%;height:100%;overflow:hidden;position:relative;cursor:grab;user-select:none;background:#050308}
.map-container.dragging{cursor:grabbing}
#map-svg{width:100%;height:100%;display:block;touch-action:none}

/* ── REGION HOVER ── */
.region{cursor:pointer;transition:filter .2s,opacity .2s}
.region:hover{filter:brightness(1.4);opacity:.9}
.region.active{filter:brightness(1.6)}

/* ── CITY DOTS ── */
.city-dot{transition:r .2s}
.city-dot:hover{r:5}
.city-label{font-family:'IM Fell English',serif;font-style:italic;pointer-events:none}

/* ── INFO PANEL ── */
.info-panel{position:absolute;top:0;right:0;bottom:0;width:300px;background:rgba(10,6,2,.96);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .3s ease;z-index:110;overflow-y:auto;backdrop-filter:blur(8px)}
.info-panel.open{transform:translateX(0)}
.info-close{position:absolute;top:.75rem;right:.75rem;background:none;border:none;color:var(--parchd);cursor:pointer;font-family:'IM Fell English',serif;font-size:1.2rem;z-index:10;transition:color .18s;line-height:1}
.info-close:hover{color:var(--gold)}
.info-body{padding:2rem 1.5rem}
.info-eyebrow{font-family:'IM Fell English',serif;font-size:.65rem;letter-spacing:.18em;color:var(--goldd);margin-bottom:.4rem;font-style:italic}
.info-name{font-family:'IM Fell English',serif;font-size:1.6rem;color:var(--parchl);line-height:1.15;margin-bottom:.25rem}
.info-capital{font-size:.82rem;font-style:italic;color:var(--gold);margin-bottom:1.25rem}
.info-rule{width:60px;height:1px;background:linear-gradient(to right,var(--goldd),transparent);margin-bottom:1.25rem}
.info-section{margin-bottom:1.25rem}
.info-sl{font-family:'IM Fell English',serif;font-size:.65rem;letter-spacing:.12em;color:var(--goldd);margin-bottom:.4rem}
.info-val{font-size:.82rem;color:var(--parchd);line-height:1.72;font-style:italic}
.info-house{display:inline-block;font-family:'IM Fell English',serif;font-size:.72rem;border:1px solid var(--borderl);padding:.2rem .65rem;color:var(--parch);font-style:italic;margin-bottom:.75rem}
.info-tags{display:flex;flex-wrap:wrap;gap:.35rem}
.itag{font-family:'IM Fell English',serif;font-size:.68rem;padding:.18rem .55rem;border:1px solid var(--border);color:var(--parchd);font-style:italic}

/* ── COORD DISPLAY ── */
.coords{position:absolute;bottom:1rem;right:1rem;z-index:100;font-family:'IM Fell English',serif;font-size:.65rem;color:var(--goldd);font-style:italic;pointer-events:none;opacity:.5}
.coords.has-panel{right:316px}

/* ── HELP TOOLTIP ── */
.hint{position:absolute;top:1rem;left:50%;transform:translateX(-50%);z-index:100;font-family:'IM Fell English',serif;font-size:.72rem;font-style:italic;color:var(--parchd);background:rgba(13,8,4,.7);border:1px solid var(--border);padding:.3rem .85rem;pointer-events:none;white-space:nowrap;opacity:1;transition:opacity 1s;backdrop-filter:blur(4px)}
.hint.fade{opacity:0}

@media(max-width:640px){.info-panel{width:100%;top:auto;height:60%;transform:translateY(100%)}.info-panel.open{transform:translateY(0)}.legend{display:none}}
</style>

// ─── PAN / ZOOM ENGINE ────────────────────────────────────
const SVG_W = 1400, SVG_H = 900;
let vx=0, vy=0, vw=SVG_W, vh=SVG_H;
let dragging=false, lastX=0, lastY=0;
let pinching=false, lastPinchDist=0;
const MIN_VW=300, MAX_VW=SVG_W*2;

function updateViewBox() {
  vx=Math.max(-SVG_W*.3, Math.min(SVG_W*.3+SVG_W-vw, vx));
  vy=Math.max(-SVG_H*.3, Math.min(SVG_H*.3+SVG_H-vh, vy));
  document.getElementById('map-svg').setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);
}

function svgPoint(clientX, clientY) {
  const svg = document.getElementById('map-svg');
  const rect = svg.getBoundingClientRect();
  return {
    x: vx + (clientX-rect.left)/rect.width*vw,
    y: vy + (clientY-rect.top)/rect.height*vh
  };
}

function zoomAt(factor, cx, cy) {
  const newVw = Math.max(MIN_VW, Math.min(MAX_VW, vw*factor));
  const newVh = newVw*(vh/vw);
  const scale = newVw/vw;
  vx = cx-(cx-vx)*scale;
  vy = cy-(cy-vy)*scale;
  vw = newVw; vh = newVh;
  updateViewBox();
}

function zoomStep(f) {
  const cx=vx+vw/2, cy=vy+vh/2;
  zoomAt(f, cx, cy);
}

function resetView() {
  vx=0;vy=0;vw=SVG_W;vh=SVG_H;
  updateViewBox();
}

// Mouse events
const mc = document.getElementById('map-container');
mc.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  mc.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx=(e.clientX-lastX)/mc.clientWidth*vw;
  const dy=(e.clientY-lastY)/mc.clientHeight*vh;
  vx-=dx; vy-=dy;
  lastX=e.clientX; lastY=e.clientY;
  updateViewBox();
});
window.addEventListener('mouseup', ()=>{
  dragging=false; mc.classList.remove('dragging');
});
mc.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = e.deltaY>0?1.15:0.87;
  const pt = svgPoint(e.clientX, e.clientY);
  zoomAt(factor, pt.x, pt.y);
},{passive:false});

// Touch events
mc.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    dragging=true;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
  } else if(e.touches.length===2){
    pinching=true; dragging=false;
    lastPinchDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
  }
  e.preventDefault();
},{passive:false});

mc.addEventListener('touchmove', e=>{
  if(dragging&&e.touches.length===1){
    const dx=(e.touches[0].clientX-lastX)/mc.clientWidth*vw;
    const dy=(e.touches[0].clientY-lastY)/mc.clientHeight*vh;
    vx-=dx; vy-=dy;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    updateViewBox();
  } else if(pinching&&e.touches.length===2){
    const dist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    const factor=lastPinchDist/dist;
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const pt=svgPoint(cx,cy);
    zoomAt(factor,pt.x,pt.y);
    lastPinchDist=dist;
  }
  e.preventDefault();
},{passive:false});

mc.addEventListener('touchend', ()=>{
  dragging=false; pinching=false;
});

// ─── INFO PANEL ───────────────────────────────────────────
let activeRegion = null;

function showInfo(id) {
  const data = REGIONS[id];
  if(!data) return;
  activeRegion = id;

  // Highlight active region
  document.querySelectorAll('.region').forEach(el=>{
    el.classList.toggle('active', el.dataset.region===id);
  });

  const tags = T(data.tags)||[];
  document.getElementById('info-body').innerHTML = `
    <p class="info-eyebrow">${T(data.eyebrow)}</p>
    <h2 class="info-name">${T(data.name)}</h2>
    <p class="info-capital">★ ${T(data.capital)}</p>
    <div class="info-rule"></div>
    <div class="info-section">
      <p class="info-sl">${L==='tr'?'YÖNETİCİ HANE':'RULING HOUSE'}</p>
      <span class="info-house">${T(data.house)}</span>
    </div>
    <div class="info-section">
      <p class="info-sl">${L==='tr'?'TANIM':'DESCRIPTION'}</p>
      <p class="info-val">${T(data.desc)}</p>
    </div>
    ${tags.length?`<div class="info-section">
      <p class="info-sl">${L==='tr'?'ÖZELLİKLER':'FEATURES'}</p>
      <div class="info-tags">${tags.map(t=>`<span class="itag">${t}</span>`).join('')}</div>
    </div>`:''}
  `;
  document.getElementById('info-panel').classList.add('open');
  document.getElementById('coords').classList.add('has-panel');
}

function closeInfo() {
  activeRegion=null;
  document.getElementById('info-panel').classList.remove('open');
  document.getElementById('coords').classList.remove('has-panel');
  document.querySelectorAll('.region').forEach(el=>el.classList.remove('active'));
}

// Click regions
document.querySelectorAll('[data-region]').forEach(el=>{
  el.addEventListener('click', e=>{
    if(el.dataset.region==='none') return;
    e.stopPropagation();
    showInfo(el.dataset.region);
  });
});
mc.addEventListener('click', e=>{
  if(e.target===mc||e.target===document.getElementById('map-svg')) closeInfo();
});

// ─── INIT ─────────────────────────────────────────────────
applyLang();
