<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harita · Stallhart Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&amp;display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
html, body { height: 100%; overflow: hidden; background: #050308; }
/* Sabit navigasyon (position:fixed) akış dışındadır; üst boşluk vermezsek
   araç çubuğu ve ipucu şeridi menünün altında kalır. */
body { display: flex; flex-direction: column; padding-top: 54px; }
#site-nav { flex-shrink: 0; }
.map-outer {
  flex: 1; overflow: hidden; position: relative;
  cursor: grab; background: #050308;
}
.map-outer.dragging { cursor: grabbing; }
.map-inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
.map-wrap  { position: relative; display: block; line-height: 0; }
/* Harita görseli doğal boyutunda kalmalı; ölçekleme transform ile yapılır.
   styles.css'teki genel  img{max-width:100%}  kuralı burada devre dışı,
   aksi hâlde görsel kapsayıcıya sıkışır ve harita yatay olarak ezilir. */
.map-wrap img { display: block; max-width: none; width: auto; height: auto; }

/* v11: Bölge poligonları haritanın gerçek coğrafyasıyla örtüşmediği için
   tamamen kaldırıldı. Harita artık saf, ölçeklenebilir bir görsel katmandır;
   eyalet bilgisine TEK erişim yolu lejanttır (bkz. LEJANT bölümü). */

/* ── ARAÇ ÇUBUĞU ── */
.toolbar { position:absolute; top:1rem; left:1rem; z-index:150; display:flex; flex-direction:column; gap:.4rem; }
.tb { width:36px; height:36px; background:rgba(6,4,2,.92); border:1px solid var(--border); color:var(--parchd); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.18s; backdrop-filter:blur(4px); }
.tb:hover { border-color:var(--goldd); color:var(--gold); }
.tb svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }

/* ── LEJANT ── */
.legend { position:absolute; bottom:1rem; left:1rem; z-index:150; background:rgba(6,4,2,.92); border:1px solid var(--border); padding:.7rem 1rem; backdrop-filter:blur(6px); max-height:calc(100vh - 120px); overflow-y:auto; }
.legend-title { font-family:var(--font-display); font-style:italic; font-size:.66rem; color:var(--goldd); letter-spacing:.1em; margin-bottom:.5rem; text-transform:uppercase; }
.leg-item { display:flex; align-items:center; gap:.5rem; margin-bottom:.28rem; cursor:pointer; transition:opacity .15s; }
.leg-item:hover { opacity:.75; }
.leg-dot { width:10px; height:10px; flex-shrink:0; border:1px solid rgba(255,255,255,.12); }
.leg-name { font-size:.7rem; color:var(--parchd); font-family:var(--font-display); font-style:italic; }

/* ── BİLGİ PANELİ ── */
.ipanel { position:absolute; top:0; right:0; bottom:0; width:320px; background:rgba(5,3,1,.98); border-left:1px solid var(--border); transform:translateX(100%); transition:transform .28s ease; z-index:100; overflow-y:auto; backdrop-filter:blur(10px); display:flex; flex-direction:column; }
.ipanel.open { transform:translateX(0); }
.ip-header { padding:1.5rem 1.5rem 1.1rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(5,3,1,.99); z-index:2; flex-shrink:0; }
.ip-close { position:absolute; top:.9rem; right:.9rem; background:none; border:1px solid transparent; color:var(--parchd); cursor:pointer; font-size:1rem; width:26px; height:26px; display:flex; align-items:center; justify-content:center; transition:.18s; }
.ip-close:hover { color:var(--gold); border-color:var(--border); }
.ip-eye { font-family:var(--font-display); font-size:.63rem; letter-spacing:.18em; color:var(--goldd); font-style:italic; margin-bottom:.3rem; text-transform:uppercase; }
.ip-color-bar { height:2px; margin-bottom:.65rem; border-radius:1px; }
.ip-name { font-family:var(--font-display); font-size:1.35rem; color:var(--parchl); line-height:1.15; margin-bottom:.2rem; }
.ip-capital { font-size:.78rem; font-style:italic; color:var(--gold); }
.ip-body { padding:1.1rem 1.5rem 2rem; flex:1; }
.ip-sl { font-family:var(--font-display); font-size:.61rem; letter-spacing:.14em; color:var(--goldd); margin-bottom:.35rem; margin-top:1rem; text-transform:uppercase; }
.ip-sl:first-child { margin-top:0; }
.ip-house { display:inline-block; font-family:var(--font-display); font-size:.75rem; border:1px solid var(--borderl); padding:.18rem .6rem; color:var(--parch); font-style:italic; }
.ip-desc { font-size:.83rem; color:var(--parchd); line-height:1.78; font-style:italic; }
.ip-tags { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.45rem; }
.iptag { font-family:var(--font-display); font-size:.67rem; padding:.16rem .5rem; border:1px solid var(--border); color:var(--parchd); font-style:italic; }
.ip-chars { display:flex; flex-direction:column; gap:.15rem; margin-top:.4rem; }
.ip-char-link { font-family:var(--font-display); font-size:.75rem; font-style:italic; color:var(--parchd); padding:.28rem .35rem; border-bottom:1px solid rgba(61,42,20,.3); text-decoration:none; transition:color .15s; display:flex; align-items:baseline; gap:.4rem; }
.ip-char-link:hover { color:var(--gold); }
.ip-char-link::before { content:'›'; color:var(--goldd); font-size:.9rem; flex-shrink:0; }
.ip-char-plain { font-family:var(--font-display); font-size:.75rem; font-style:italic; color:var(--parchd); padding:.28rem .35rem; border-bottom:1px solid rgba(61,42,20,.3); display:flex; align-items:baseline; gap:.4rem; }
.ip-char-plain::before { content:'·'; color:var(--border); flex-shrink:0; }
.ip-char-role { font-size:.68rem; color:var(--goldd); }
.ip-lore-link { display:inline-flex; align-items:center; gap:.4rem; font-family:var(--font-display); font-style:italic; font-size:.74rem; color:var(--goldd); text-decoration:none; transition:.15s; margin-top:.85rem; border:1px solid var(--border); padding:.28rem .7rem; }
.ip-lore-link:hover { color:var(--gold); border-color:var(--goldd); }

/* ── İPUCU ── */
.hint { position:absolute; top:1rem; left:50%; transform:translateX(-50%); z-index:150; font-family:var(--font-display); font-size:.7rem; font-style:italic; color:var(--parchd); background:rgba(6,4,2,.82); border:1px solid var(--border); padding:.3rem .85rem; pointer-events:none; white-space:nowrap; transition:opacity 1.2s; backdrop-filter:blur(4px); }
.hint.gone { opacity:0; }
.map-loading { position:absolute; inset:0; display:flex; flex-direction:column; gap:.6rem; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; color:var(--goldd); font-size:1rem; z-index:50; text-align:center; padding:2rem; }

/* Ölçek göstergesi */
.scale-bar { position:absolute; bottom:1rem; right:1rem; z-index:150; background:rgba(6,4,2,.92); border:1px solid var(--border); padding:.4rem .7rem; backdrop-filter:blur(4px); font-family:var(--font-display); font-style:italic; font-size:.68rem; color:var(--parchd); display:flex; flex-direction:column; gap:.3rem; align-items:center; }
.scale-line { height:6px; border-left:1px solid var(--goldd); border-right:1px solid var(--goldd); border-bottom:1px solid var(--goldd); transition:width .15s; }
.zoom-level { color:var(--goldd); }
.tb:disabled { opacity:.35; cursor:default; border-color:var(--border); color:var(--parchd); }
.tb:disabled:hover { border-color:var(--border); color:var(--parchd); }
.map-outer:focus-visible { outline:1px solid var(--goldd); outline-offset:-2px; }
@media (max-width:600px) { .ipanel { width:100%; } .legend { display:none; } .scale-bar { bottom:.6rem; right:.6rem; } }
</style>
</head>
<body>

<div class="map-outer" id="outer" tabindex="0" aria-label="İnteraktif imparatorluk haritası">

  <div class="map-loading" id="loading">
    <span class="sw-loading">Harita yükleniyor</span>
    <small style="font-size:.7rem;color:var(--border)">assets/images/SIYASI_HARITA.jpg</small>
  </div>

  <div class="map-inner" id="inner">
    <div class="map-wrap" id="wrap">
      <img id="map-img" src="assets/images/SIYASI_HARITA.jpg"
           alt="Stallhart İmparatorluğu Siyasi Haritası" decoding="async">
    </div>
  </div>

  <!-- v10: Harita artık saf görsel — fare-üstü ipucu balonu kaldırıldı.
       Bölge bilgisine tek erişim yolu aşağıdaki lejanttır. -->

  <div class="toolbar">
    <button class="tb" id="zoom-in"  type="button" title="Yakınlaştır" aria-label="Yakınlaştır"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="tb" id="zoom-out" type="button" title="Uzaklaştır" aria-label="Uzaklaştır"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="tb" id="zoom-reset" type="button" title="Sıfırla" aria-label="Görünümü sıfırla"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg></button>
  </div>

  <div class="legend" id="legend">
    <div class="legend-title" id="leg-title">Eyaletler</div>
    <div id="leg-items"></div>
  </div>

  <div class="scale-bar" id="scale-bar">
    <span class="zoom-level" id="zoom-level">%100</span>
    <div class="scale-line" id="scale-line" style="width:80px"></div>
    <span id="scale-label">—</span>
  </div>

  <div class="hint" id="hint">Sürükle · Kaydır/Sıkıştır: zoom · Lejanttan eyalet seç: bilgi</div>

  <div class="ipanel" id="ipanel" role="complementary">
    <div class="ip-header">
      <button class="ip-close" id="ip-close" type="button" aria-label="Kapat">✕</button>
      <div class="ip-eye" id="ip-eye"></div>
      <div class="ip-color-bar" id="ip-color-bar"></div>
      <h2 class="ip-name" id="ip-name"></h2>
      <p class="ip-capital" id="ip-capital"></p>
    </div>
    <div class="ip-body" id="ip-body"></div>
  </div>
</div>

<script src="assets/js/wiki.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   HARİTA — v7
   Düzeltilenler:
   1. Görsel yükleme yarışı: <img onload="onImgLoad()"> satır içi kancası,
      görsel önbellekten anında gelirse betik tanımlanmadan tetikleniyor
      ve "Harita yükleniyor…" ekranda kalıyordu. Artık img.complete
      kontrolü + addEventListener kullanılıyor.
   2. Yakınlaştırma düğmeleri terstin: "+" 0.7 (uzaklaştırma) çağırıyordu.
   3. Sürükleme sonrası bırakılan tıklama bölge panelini açıyordu;
      artık 6 pikselden fazla hareket eden tıklamalar yok sayılıyor.
   4. Ölçek sınırları görünür duruma bağlandı, ölçek çubuğu eklendi.
   5. Pencere yeniden boyutlandığında görünüm yeniden oturtuluyor.
   ═══════════════════════════════════════════════════════════════ */
'use strict';
const { Lang, initWiki, esc } = Wiki;

const REGIONS = {
  khasinia:{color:'#8A5A32',name:{tr:'Khasinia / Khasinya',en:'Khasinia / Khasinya'},eye:{tr:'Doğu Adası',en:'Eastern Island'},capital:{tr:'★ Khasinya Kalesi',en:'★ Khasinya Fortress'},house:{tr:'Khasin Hanesi',en:'House Khasin'},desc:{tr:"I. Lun Aldris tarafından Safir Boğazı'ndaki deniz zaferinin ardından boyun eğdirilen ada. Güçlü deniz kültürü ve tarihî isyan eğilimiyle bilinir. İmparatorluğun en zorlu eyaletlerinden biridir.",en:"The island subdued by Lun Aldris I after the Sapphire Strait naval victory. Known for strong maritime culture and historical rebellious tendencies. Remains one of the empire's most challenging provinces."},tags:{tr:['Deniz Kültürü','Tarihsel İsyan','Khasin Hanesi'],en:['Maritime Culture','Historical Rebellion','House Khasin']},chars:[{name:'Yunghar Khasin',role:{tr:'Vali',en:'Governor'},id:null}],loreId:null},

  adamen:{color:'#3A7A50',name:{tr:'Adamen',en:'Adamen'},eye:{tr:'Güneybatı Eyaleti',en:'Southwestern Province'},capital:{tr:'★ Adamen Madenleri',en:'★ Adamen Mines'},house:{tr:'Saert Hanesi (Cüce Vali)',en:'House Saert (Dwarf Governor)'},desc:{tr:'İmparatorluğun en büyük maden yataklarına ev sahipliği yapan eyalet. Cüce Vali Gulwar Saert işçi haklarını savunur. İlk Anne inancının en güçlü biçimde yaşadığı topraklar; madencilerin ninnileri hâlâ çınlar.',en:"Province home to the empire's largest mineral deposits. Dwarf Governor Gulwar Saert advocates for miners' rights. The land where the First Mother faith survives most strongly — in miners' lullabies."},tags:{tr:['Maden Yatakları','Cüce Nüfus','İlk Anne İzleri'],en:['Mineral Deposits','Dwarf Population','First Mother Traces']},chars:[{name:'Gulwar Saert',role:{tr:'Cüce Vali',en:'Dwarf Governor'},id:null}],loreId:null},

  zela:{color:'#2A6A85',name:{tr:"Z'ela",en:"Z'ela"},eye:{tr:'Batı Eyaleti',en:'Western Province'},capital:{tr:'★ Garall Limanı ⚓',en:'★ Port of Garall ⚓'},house:{tr:'Çeşitli Haneler (Carvhen, İtrez…)',en:'Various Houses (Carvhen, Itrez…)'},desc:{tr:"Gümüş Yol Boğazı'nın kuzey yakasında Garall limanıyla kıtalar arası ticaretin merkezi. Eyaletin karmaşık haneler yapısı, merkezi otoritenin zayıfladığı dönemlerde ciddi baskı noktasına dönüşür.",en:"On the north bank of the Silver Way Strait, Port Garall is the center of intercontinental trade. The province's complex house structure becomes a major pressure point when central authority weakens."},tags:{tr:['Garall Limanı','Deniz Ticareti','Boğaz Kontrolü'],en:['Port of Garall','Maritime Trade','Strait Control']},chars:[{name:'Arba İtrez',role:{tr:"Z'ela Soylusu",en:"Z'ela Noble"},id:null}],loreId:'zela'},

  galetsha:{color:'#6A3D14',name:{tr:'Galetsha',en:'Galetsha'},eye:{tr:'Kuzey Eyaleti',en:'Northern Province'},capital:{tr:'★ Galetsha Kalesi',en:'★ Galetsha Fortress'},house:{tr:'Galet / Galetsha Hanesi',en:'House Galet / Galetsha'},desc:{tr:"Sarp geçitleri ve stratejik mevzileriyle kuzeyin bekçisi. Wolrez Galet, Arathen casusu Eron Gjin ile ittifak kurarak Olinder Albea suikastını örgütledi — Erthan yayının fitilini ateşledi.",en:"Guardian of the north with treacherous passes. Wolrez Galet allied with Arathen spy Eron Gjin to orchestrate Olinder Albea's assassination — igniting the Erthan arc."},tags:{tr:['Sarp Dağlar','Stratejik Geçitler','Arathen İttifakı'],en:['Rugged Mountains','Strategic Passes','Arathen Alliance']},chars:[{name:'Wolrez Galet',role:{tr:'Galetsha Valisi',en:'Governor of Galetsha'},id:'wolrez-galet'},{name:'Metron Galetsha',role:{tr:'Eski Vali (Ölü)',en:'Former Governor (Deceased)'},id:null}],loreId:'galetsha'},

  highsanjak:{color:'#9A7810',name:{tr:'High Sanjak / Başsancak',en:'High Sanjak / Başsancak'},eye:{tr:'Başkent Eyaleti',en:'Capital Province'},capital:{tr:'★ Arava — İmparatorluk Başkenti',en:'★ Arava — Imperial Capital'},house:{tr:'Stallhart Hanedanı',en:'Stallhart Dynasty'},desc:{tr:"İmparatorluğun kalbi. Stallhart sarayının bulunduğu Arava şehri tüm eyaletlerin siyasi odak noktasıdır. Karabıçaklar buradan yönetilir. Rones döneminde büyüyen şehir İmloth yönetiminde derin bir çürüme yaşadı.",en:"The empire's heart. Arava, seat of the Stallhart palace, is the political focal point. The Black Claws operate from here. The city grew under Rones but fell into deep rot under Imloth."},tags:{tr:['İmparatorluk Sarayı','Arava Şehri','Karabıçaklar Merkezi'],en:['Imperial Palace','City of Arava','Black Claws HQ']},chars:[{name:'Zeandor Stallhart',role:{tr:'İmparator (Tahtta)',en:'Emperor (On Throne)'},id:'zeandor'},{name:'Amadon Stallhart',role:{tr:'Eski İmparator',en:'Former Emperor'},id:'amadon'},{name:'Hilnor Wolde',role:{tr:'Baş Danışman',en:'Chief Advisor'},id:'hilnor-wolde'},{name:'Edun Solgar',role:{tr:'Sürgün Başvezir',en:'Exiled Grand Vizier'},id:'edun-solgar'}],loreId:'bassancak'},

  memanth:{color:'#6A4A9A',name:{tr:'Memanth',en:'Memanth'},eye:{tr:'Kuzey Eyaleti',en:'Northern Province'},capital:{tr:'★ Craber Kalesi 🏰',en:'★ Craber Fortress 🏰'},house:{tr:'Sınglew Hanesi (önde gelen)',en:'House Sınglew (prominent)'},desc:{tr:"Kuzey sınır hattının kritik dayanak noktası. Craber Kalesi ve Arava Garnizonu bölgenin askerî omurgasını oluşturur. Reanloth'un sabırlı seferlerle ilhak ettiği eyalet, Erthan isyanında kritik savaş alanlarına ev sahipliği yaptı.",en:"Critical anchor of the northern frontier. Craber Fortress and Arava Garrison form the military backbone. Annexed by Reanloth through patient campaigns; hosted critical battlegrounds during Erthan's rebellion."},tags:{tr:['Craber Kalesi','Arava Garnizonu','Kuzey Sınırı'],en:['Craber Fortress','Arava Garrison','Northern Border']},chars:[{name:'Aertas Sınglew',role:{tr:'Doğu Sınırı Komutanı',en:'Eastern Border Commander'},id:'aertas-singlew'}],loreId:null},

  onneva:{color:'#5A8010',name:{tr:'Onneva',en:'Onneva'},eye:{tr:'Doğu Eyaleti',en:'Eastern Province'},capital:{tr:'★ Onneva Limanı ⚓',en:'★ Port of Onneva ⚓'},house:{tr:'Onneva Hanesi',en:'House Onneva'},desc:{tr:"Gümüş Yol Boğazı'nın güneydoğu yakasında Todfa ve Gom Ara geçiş noktalarıyla stratejik değer taşır. İmparatorluk Donanması'nın kritik güney üssüdür.",en:"On the southeastern bank of the Silver Way Strait with the crossing points Todfa and Gom Ara. Critical southern base of the Imperial Navy."},tags:{tr:['Todfa Geçidi','Gom Ara','Deniz Üssü'],en:['Todfa Crossing','Gom Ara','Naval Base']},chars:[{name:'Irin Onneva',role:{tr:'Eski Yüksek Rahip (Ölü)',en:'Former High Priest (Deceased)'},id:null}],loreId:null},

  solgar:{color:'#9A4A10',name:{tr:'Solgar',en:'Solgar'},eye:{tr:'Merkez Eyaleti',en:'Central Province'},capital:{tr:'★ Solgar Sarayı',en:'★ Solgar Palace'},house:{tr:'Solgar Hanesi',en:'House Solgar'},desc:{tr:"Edun Solgar'ın Zeandor tarafından sürgün edildiği eyalet. Bakırsu Vadisi bu topraklarda yer alır — Reun Solgar ordusunun imparatorluk tarihinin en ağır bozgunlarından birini yaşadığı yer.",en:"The province to which Edun Solgar was exiled by Zeandor. Bakırsu Valley lies in these lands — where Reun Solgar's army suffered one of the empire's most catastrophic defeats."},tags:{tr:["Edun Solgar'ın Sürgünü",'Bakırsu Vadisi','Bataklık Zenginlikleri'],en:["Edun Solgar's Exile",'Bakırsu Valley','Marsh Riches']},chars:[{name:'Edun Solgar',role:{tr:'Sürgün Başvezir',en:'Exiled Grand Vizier'},id:'edun-solgar'},{name:'Reun Solgar',role:{tr:'Yenilmiş Komutan',en:'Defeated Commander'},id:'reun-solgar'}],loreId:'solgar'},

/* ── DURUM ─────────────────────────────────────────────────── */
const outer  = document.getElementById('outer');
const inner  = document.getElementById('inner');
const img    = document.getElementById('map-img');
/* tipEl: v10'da kaldırıldı — harita artık saf görsel, ipucu balonu yok. */

const MIN_SC = 0.05, MAX_SC = 8;
let sc = 1, tx = 0, ty = 0, fitScale = 1;
let drag = false, moved = 0, dx = 0, dy = 0, stx = 0, sty = 0;
let pinch = false, pinchD = 0;
let activeR = null;
let ready = false;

function applyT() {
  inner.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sc + ')';
  updateScaleBar();
}
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

function doZoom(factor, cx, cy) {
  const next = clamp(sc * factor, MIN_SC, MAX_SC);
  if (next === sc) return;
  tx = cx - (cx - tx) * (next / sc);
  ty = cy - (cy - ty) * (next / sc);
  sc = next;
  applyT();
  updateButtons();
}

function zoomBtn(factor) {
  doZoom(factor, outer.clientWidth / 2, outer.clientHeight / 2);
}

function resetView() {
  if (!img.naturalWidth) return;
  const ow = outer.clientWidth, oh = outer.clientHeight;
  const asp = img.naturalWidth / img.naturalHeight;
  let w = ow, h = ow / asp;
  if (h > oh) { h = oh; w = oh * asp; }
  fitScale = w / img.naturalWidth;
  sc = fitScale;
  tx = (ow - img.naturalWidth * sc) / 2;
  ty = (oh - img.naturalHeight * sc) / 2;
  applyT();
  updateButtons();
}

function updateButtons() {
  document.getElementById('zoom-in').disabled  = sc >= MAX_SC - 1e-6;
  document.getElementById('zoom-out').disabled = sc <= MIN_SC + 1e-6;
}

/* Ölçek çubuğu: 80 pikselin haritada kaç piksele denk geldiğini gösterir. */
function updateScaleBar() {
  const lvl = document.getElementById('zoom-level');
  const lbl = document.getElementById('scale-label');
  if (!lvl || !fitScale) return;
  lvl.textContent = '%' + Math.round((sc / fitScale) * 100);
  const mapPx = Math.round(80 / sc);
  lbl.textContent = mapPx.toLocaleString('tr-TR') + ' br';
}

/* ── GÖRSEL YÜKLEME (yarış koşulu düzeltildi) ─────────────── */
function onImgLoad() {
  if (ready) return;
  ready = true;
  const loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';
  img.style.width  = img.naturalWidth + 'px';
  img.style.height = img.naturalHeight + 'px';
  resetView();
  checkHash();
  setTimeout(() => {
    const h = document.getElementById('hint');
    if (h) h.classList.add('gone');
  }, 4500);
}

function onImgError() {
  const loading = document.getElementById('loading');
  if (!loading) return;
  loading.innerHTML =
    '<div style="max-width:340px;text-align:center">' +
    '<p style="color:var(--bloodb);font-style:italic;margin-bottom:.75rem">Harita görseli yüklenemedi.</p>' +
    '<p style="font-size:.8rem;color:var(--parchd);line-height:1.7">' +
    '<strong style="color:var(--goldd)">assets/images/SIYASI_HARITA.jpg</strong> dosyasının ' +
    'depoya yüklendiğinden ve dosya adının büyük/küçük harfine kadar aynı olduğundan emin olun. ' +
    'GitHub Pages dosya adlarında büyük/küçük harf ayrımı yapar.</p></div>';
}

img.addEventListener('load', onImgLoad);
img.addEventListener('error', onImgError);
/* Önbellekten gelip load olayını kaçırdıysak: */
if (img.complete) { img.naturalWidth ? onImgLoad() : onImgError(); }

/* ── FARE: SÜRÜKLE ────────────────────────────────────────── */
outer.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('#ipanel') || e.target.closest('.toolbar') || e.target.closest('.legend')) return;
  drag = true; moved = 0;
  dx = e.clientX; dy = e.clientY; stx = tx; sty = ty;
  outer.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const mx = e.clientX - dx, my = e.clientY - dy;
  moved = Math.max(moved, Math.abs(mx) + Math.abs(my));
  tx = stx + mx; ty = sty + my;
  applyT();
});
window.addEventListener('mouseup', () => {
  drag = false;
  outer.classList.remove('dragging');
});

/* ── TEKERLEK ─────────────────────────────────────────────── */
outer.addEventListener('wheel', e => {
  e.preventDefault();
  const r = outer.getBoundingClientRect();
  doZoom(e.deltaY > 0 ? 0.88 : 1.135, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

/* ── DOKUNMA ──────────────────────────────────────────────── */
outer.addEventListener('touchstart', e => {
  if (e.target.closest('#ipanel') || e.target.closest('.toolbar')) return;
  if (e.touches.length === 1) {
    drag = true; moved = 0;
    dx = e.touches[0].clientX; dy = e.touches[0].clientY; stx = tx; sty = ty;
  } else if (e.touches.length === 2) {
    drag = false; pinch = true;
    pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (drag && e.touches.length === 1) {
    const mx = e.touches[0].clientX - dx, my = e.touches[0].clientY - dy;
    moved = Math.max(moved, Math.abs(mx) + Math.abs(my));
    tx = stx + mx; ty = sty + my;
    applyT();
    e.preventDefault();
  } else if (pinch && e.touches.length === 2) {
    const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                          e.touches[0].clientY - e.touches[1].clientY);
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const r = outer.getBoundingClientRect();
    if (pinchD > 0) doZoom(nd / pinchD, cx - r.left, cy - r.top);
    pinchD = nd;
    e.preventDefault();
  }
}, { passive: false });

outer.addEventListener('touchend', () => { drag = false; pinch = false; });

/* ── ARAÇ ÇUBUĞU ──────────────────────────────────────────── */
document.getElementById('zoom-in').addEventListener('click', () => zoomBtn(1.4));
document.getElementById('zoom-out').addEventListener('click', () => zoomBtn(1 / 1.4));
document.getElementById('zoom-reset').addEventListener('click', resetView);

/* Klavye ile ölçek (erişilebilirlik) */
outer.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomBtn(1.4); }
  if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomBtn(1 / 1.4); }
  if (e.key === '0') { e.preventDefault(); resetView(); }
});

/* Pencere yeniden boyutlandığında görünümü koru */
let rsTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(() => { if (ready && Math.abs(sc - fitScale) < 1e-6) resetView(); }, 180);
});

/* ── HARİTA SAF GÖRSEL ────────────────────────────────────────
   v10: Bölge poligonları artık tıklanabilir/vurgulanabilir DEĞİL.
   Harita tamamen görsel kalır — bölge bilgisine erişimin TEK yolu
   lejanttır (bkz. LEJANT bölümü, buildLegend()). Poligonlar yalnızca
   koordinat referansı olarak DOM'da kalır (lejanttan showInfo()
   çağrıldığında hangi bölgenin diyalog başlığı/rengi kullanılacağını
   REGIONS nesnesinden okumak için data-r kimliği hâlâ kullanılıyor,
   ama artık kendileri fare olayı almıyor). */

outer.addEventListener('click', e => {
  if (moved > 6) return;
  if (!e.target.closest('#ipanel') &&
      !e.target.closest('.toolbar') && !e.target.closest('.legend')) closeInfo();
});

function showInfo(id) {
  const d = REGIONS[id];
  if (!d) return;
  const l = Lang.get();
  activeR = id;

  document.getElementById('ip-eye').textContent = Lang.t(d.eye);
  document.getElementById('ip-color-bar').style.background =
    'linear-gradient(to right,' + d.color + ',transparent)';
  document.getElementById('ip-name').textContent = Lang.t(d.name);
  document.getElementById('ip-capital').textContent = Lang.t(d.capital);

  const charsHTML = (d.chars || []).map(c => c.id
    ? '<a class="ip-char-link" href="karakter-sablon.html?id=' + encodeURIComponent(c.id) + '">' +
      esc(c.name) + '<span class="ip-char-role">— ' + esc(Lang.t(c.role)) + '</span></a>'
    : '<div class="ip-char-plain">' + esc(c.name) +
      '<span class="ip-char-role">— ' + esc(Lang.t(c.role)) + '</span></div>'
  ).join('');

  const loreLink = d.loreId
    ? '<a class="ip-lore-link" href="lore.html#' + esc(d.loreId) + '">' +
      '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
      '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' +
      (l === 'tr' ? 'Evren ansiklopedisinde aç' : 'Open in encyclopedia') + '</a>'
    : '';

  const tags = Lang.t(d.tags);
  document.getElementById('ip-body').innerHTML =
    '<p class="ip-sl">' + (l === 'tr' ? 'YÖNETİCİ HANE' : 'RULING HOUSE') + '</p>' +
    '<span class="ip-house">' + esc(Lang.t(d.house)) + '</span>' +
    '<p class="ip-sl">' + (l === 'tr' ? 'TANIM' : 'DESCRIPTION') + '</p>' +
    '<p class="ip-desc">' + esc(Lang.t(d.desc)) + '</p>' +
    (Array.isArray(tags) && tags.length
      ? '<p class="ip-sl">' + (l === 'tr' ? 'ÖZELLİKLER' : 'FEATURES') + '</p>' +
        '<div class="ip-tags">' + tags.map(x => '<span class="iptag">' + esc(x) + '</span>').join('') + '</div>'
      : '') +
    (charsHTML
      ? '<p class="ip-sl">' + (l === 'tr' ? 'İLGİLİ KARAKTERLER' : 'RELATED CHARACTERS') + '</p>' +
        '<div class="ip-chars">' + charsHTML + '</div>'
      : '') +
    loreLink;

  Wiki.Tooltip.scan(document.getElementById('ip-body'));
  document.getElementById('ipanel').classList.add('open');
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}

function closeInfo() {
  activeR = null;
  document.getElementById('ipanel').classList.remove('open');
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

document.getElementById('ip-close').addEventListener('click', closeInfo);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeInfo(); });

/* ── LEJANT (olay devri) ──────────────────────────────────── */
function buildLegend() {
  document.getElementById('leg-title').textContent = Lang.get() === 'tr' ? 'Eyaletler' : 'Provinces';
  document.getElementById('leg-items').innerHTML = Object.keys(REGIONS).map(id => {
    const r = REGIONS[id];
    return '<div class="leg-item" data-goto="' + esc(id) + '" role="button" tabindex="0">' +
      '<div class="leg-dot" style="background:' + r.color + '"></div>' +
      '<span class="leg-name">' + esc(Lang.t(r.name)) + '</span></div>';
  }).join('');
}
document.getElementById('leg-items').addEventListener('click', e => {
  const item = e.target.closest('[data-goto]');
  if (item) showInfo(item.dataset.goto);
});
document.getElementById('leg-items').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const item = e.target.closest('[data-goto]');
  if (item) { e.preventDefault(); showInfo(item.dataset.goto); }
});

/* ── HASH ─────────────────────────────────────────────────── */
function checkHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && REGIONS[h]) showInfo(h);
}
window.addEventListener('hashchange', checkHash);

/* ── DİL ──────────────────────────────────────────────────── */
function applyLang(l) {
  document.documentElement.lang = l;
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = l === 'tr'
    ? 'Sürükle · Kaydır/Sıkıştır: zoom · Lejanttan eyalet seç: bilgi'
    : 'Drag · Scroll/Pinch: zoom · Pick a province from the legend: info';
  document.title = (l === 'tr' ? 'Harita' : 'Map') + ' · Stallhart Wiki';
  buildLegend();
  if (activeR) showInfo(activeR);
}

initWiki({ onLangChange: applyLang, injectFooter: false });
buildLegend();
updateButtons();
</script>
