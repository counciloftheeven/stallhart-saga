<!DOCTYPE html>
<html lang="tr" id="r">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Stallhart Destanı — Karakter Ansiklopedisi">
<title>Karakterler — Son İmparator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060402;--deep:#0d0804;--surface:#110b05;
  --card:rgba(24,16,7,.78);--border:#3D2A14;--borderl:#5C3F1E;
  --gold:#C4962A;--goldb:#E8B84B;--goldd:#7A5C18;
  --parch:#D4C0A0;--parchl:#F0E6C8;--parchd:#9A8870;
  --blood:#5C1A1A;--bloodb:#8B2A2A;
  --c-stallhart:#C4962A;--c-arhan:#8B2A2A;--c-solgar:#3A5A9A;
  --c-selya:#7A3A9A;--c-rebel:#3A7A2A;--c-arathen:#2A6A8A;
  --c-court:#7A5C18;--c-other:#5C4A5C;
}
html{scroll-behavior:smooth}
body{background:var(--bg);background-image:radial-gradient(ellipse 70% 50% at 18% 18%,rgba(92,26,26,.08) 0%,transparent 100%);color:var(--parch);font-family:'Libre Baskerville',Georgia,serif;font-size:16px;line-height:1.75;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--deep)}::-webkit-scrollbar-thumb{background:var(--border)}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(4,2,1,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:54px;gap:1rem}
.nav-brand{font-family:'IM Fell English',serif;font-size:1.1rem;color:var(--gold);text-decoration:none;white-space:nowrap;flex-shrink:0}
.nav-links{display:flex;gap:1.4rem;list-style:none;flex:1;justify-content:center}
.nav-links a{font-family:'IM Fell English',serif;font-size:.88rem;color:var(--parchd);text-decoration:none;transition:color .18s}
.nav-links a:hover,.nav-links a.cur{color:var(--gold)}
.nav-r{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.lang-btn{font-family:'IM Fell English',serif;font-size:.8rem;color:var(--parchd);background:none;border:1px solid var(--border);padding:.3rem .65rem;cursor:pointer;transition:.18s}
.lang-btn:hover{border-color:var(--goldd);color:var(--gold)}
.nav-ham{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px;flex-shrink:0}
.nav-ham span{display:block;width:22px;height:1.5px;background:var(--parchd)}
@media(max-width:700px){.nav-links{display:none;flex-direction:column;position:absolute;top:54px;left:0;right:0;background:rgba(4,2,1,.97);border-bottom:1px solid var(--border);padding:1rem 2rem;gap:.9rem}.nav-links.open{display:flex}.nav-ham{display:flex}}

/* PAGE HERO */
.pg-hero{padding:110px 2rem 3.5rem;text-align:center;border-bottom:1px solid var(--border);background:var(--deep)}
.pg-hero h1{font-family:'IM Fell English',serif;font-size:clamp(2.2rem,5vw,3.6rem);color:var(--parchl);margin-bottom:.5rem;line-height:1.1}
.pg-hero p{color:var(--parchd);font-style:italic;max-width:540px;margin:0 auto;font-size:.95rem}

/* CONTROLS */
.ctrl{background:var(--deep);border-bottom:1px solid var(--border);padding:1rem 2rem;position:sticky;top:54px;z-index:100}
.ctrl-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
.srch-w{position:relative}
.srch-w svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--parchd);fill:none;stroke-width:2;stroke-linecap:round}
#srch{background:rgba(24,16,7,.9);border:1px solid var(--border);padding:.55rem .75rem .55rem 2.1rem;color:var(--parch);font-family:'Libre Baskerville',serif;font-size:.82rem;outline:none;transition:border-color .18s;width:220px}
#srch::placeholder{color:var(--parchd)}
#srch:focus{border-color:var(--goldd)}
.filters{display:flex;flex-wrap:wrap;gap:.35rem}
.fb{font-family:'IM Fell English',serif;font-size:.76rem;color:var(--parchd);background:none;border:1px solid var(--border);padding:.28rem .8rem;cursor:pointer;transition:.18s;white-space:nowrap;font-style:italic}
.fb:hover{border-color:var(--goldd);color:var(--parchl)}
.fb.on{color:var(--bg);background:var(--gold);border-color:var(--gold);font-style:normal}
.ctrl-stat{font-family:'IM Fell English',serif;font-size:.75rem;color:var(--parchd);font-style:italic;margin-left:auto}

/* GRID */
.chars-sec{padding:2.5rem 2rem 6rem}
.c-inn{max-width:1200px;margin:0 auto}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:1.2rem}
.no-r{font-family:'IM Fell English',serif;font-style:italic;color:var(--parchd);padding:4rem 0;text-align:center;display:none}

/* CARD */
.cc{background:var(--card);border:1px solid var(--border);padding:1.5rem;cursor:pointer;position:relative;transition:border-color .2s,transform .15s;outline:none}
.cc:hover,.cc:focus{transform:translateY(-1px)}
.cc::before,.cc::after{content:'';position:absolute;width:9px;height:9px;border-style:solid;pointer-events:none;transition:border-color .2s}
.cc::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.cc::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.cc:hover::before,.cc:focus::before,.cc:hover::after,.cc:focus::after{border-color:var(--gold)!important}
.cc.stallhart{border-color:rgba(196,150,42,.25)}.cc.stallhart::before,.cc.stallhart::after{border-color:rgba(196,150,42,.4)}
.cc.arhan{border-color:rgba(139,42,42,.25)}.cc.arhan::before,.cc.arhan::after{border-color:rgba(139,42,42,.5)}
.cc.solgar{border-color:rgba(58,90,154,.2)}.cc.solgar::before,.cc.solgar::after{border-color:rgba(58,90,154,.5)}
.cc.selya{border-color:rgba(122,58,154,.2)}.cc.selya::before,.cc.selya::after{border-color:rgba(122,58,154,.5)}
.cc.rebel{border-color:rgba(58,122,42,.2)}.cc.rebel::before,.cc.rebel::after{border-color:rgba(58,122,42,.5)}
.cc.arathen{border-color:rgba(42,106,138,.2)}.cc.arathen::before,.cc.arathen::after{border-color:rgba(42,106,138,.5)}
.cc.court{border-color:rgba(122,92,24,.2)}.cc.court::before,.cc.court::after{border-color:rgba(122,92,24,.5)}
.cc.other{border-color:rgba(92,74,92,.2)}.cc.other::before,.cc.other::after{border-color:rgba(92,74,92,.5)}
.cc-dot{position:absolute;top:1rem;right:1rem;width:7px;height:7px;border-radius:50%}
.cc-dot.alive{background:rgba(196,150,42,.45)}
.cc-dot.deceased{background:rgba(92,26,26,.6)}
.cc-dot.historical{background:rgba(58,46,28,.5)}
.cc-dot.alive::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:1px solid rgba(196,150,42,.2)}
.cc-house{font-family:'IM Fell English',serif;font-style:italic;font-size:.7rem;letter-spacing:.08em;margin-bottom:.35rem}
.stallhart .cc-house{color:var(--c-stallhart)}.arhan .cc-house{color:var(--c-arhan)}
.solgar .cc-house{color:var(--c-solgar)}.selya .cc-house{color:var(--c-selya)}
.rebel .cc-house{color:var(--c-rebel)}.arathen .cc-house{color:var(--c-arathen)}
.court .cc-house{color:var(--c-court)}.other .cc-house{color:var(--c-other)}
.cc-name{font-family:'IM Fell English',serif;font-size:1.18rem;color:var(--parchl);margin-bottom:.18rem;line-height:1.2}
.cc-role{font-size:.8rem;font-style:italic;color:var(--gold);margin-bottom:.85rem}
.cc-bio{font-size:.8rem;color:var(--parchd);line-height:1.72;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cc-epi{display:block;margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--border);font-family:'IM Fell English',serif;font-style:italic;font-size:.7rem;color:var(--bloodb)}

/* MODAL */
.mo{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity .22s}
.mo.vis{opacity:1;pointer-events:auto}
.mo-box{background:#0c0803;border:1px solid var(--borderl);width:100%;max-width:880px;max-height:92vh;overflow-y:auto;position:relative;display:grid;grid-template-columns:220px 1fr}
@media(max-width:640px){.mo-box{grid-template-columns:1fr;max-height:95vh}}
.mo-close{position:absolute;top:.9rem;right:1rem;background:none;border:none;color:var(--parchd);cursor:pointer;font-family:'IM Fell English',serif;font-size:1.3rem;z-index:10;transition:color .18s;line-height:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.mo-close:hover{color:var(--gold)}

/* modal left */
.mo-l{background:#080502;border-right:1px solid var(--border);padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:1.25rem}
@media(max-width:640px){.mo-l{border-right:none;border-bottom:1px solid var(--border);flex-direction:row;flex-wrap:wrap;gap:1rem;padding:1.5rem}}
.mo-portrait{width:160px;height:214px;background:rgba(20,12,6,.8);border:1px solid var(--border);position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
@media(max-width:640px){.mo-portrait{width:100px;height:134px}}
.mo-portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.mo-portrait img.loaded{display:block}
.mo-frame{position:absolute;inset:5px;border:1px solid rgba(196,150,42,.12);pointer-events:none}
.mo-frame::before,.mo-frame::after{content:'';position:absolute;width:7px;height:7px;border-color:rgba(196,150,42,.25);border-style:solid}
.mo-frame::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.mo-frame::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.mo-init{font-family:'IM Fell English',serif;font-size:3.5rem;color:var(--goldd);opacity:.3;user-select:none;position:relative}
.mo-badge{font-family:'IM Fell English',serif;font-style:italic;font-size:.78rem;text-align:center;line-height:1.45}
.mo-meta{width:100%;display:flex;flex-direction:column;gap:.55rem}
@media(max-width:640px){.mo-meta{flex-direction:row;flex-wrap:wrap;gap:.5rem 1.5rem}}
.mo-mr{display:flex;flex-direction:column;gap:.08rem}
.mo-ml{font-family:'IM Fell English',serif;font-size:.63rem;letter-spacing:.1em;color:var(--goldd)}
.mo-mv{font-size:.78rem;color:var(--parchd)}

/* modal right */
.mo-r{padding:2rem;display:flex;flex-direction:column;gap:1.2rem;overflow-y:auto}
.mo-name{font-family:'IM Fell English',serif;font-size:1.85rem;color:var(--parchl);line-height:1.12;margin-bottom:.2rem}
.mo-title{font-size:.88rem;font-style:italic;color:var(--gold);margin-bottom:.65rem}
.mo-rule{width:70px;height:1px;background:linear-gradient(to right,var(--goldd),transparent)}
.mo-bio{font-size:.88rem;color:var(--parch);line-height:1.82}
.mo-quote{border-left:2px solid var(--borderl);padding:.8rem 1rem;font-style:italic;font-size:.85rem;color:var(--parchd);line-height:1.82;background:rgba(6,4,2,.5)}
.mo-sl{font-family:'IM Fell English',serif;font-size:.68rem;letter-spacing:.12em;color:var(--goldd);margin-bottom:.45rem}
.tag-list{display:flex;flex-wrap:wrap;gap:.35rem}
.tg{font-family:'IM Fell English',serif;font-size:.74rem;padding:.2rem .65rem;border:1px solid var(--borderl);color:var(--parchd);cursor:pointer;background:rgba(20,12,6,.6);transition:.15s;font-style:italic}
.tg:hover{border-color:var(--gold);color:var(--gold)}
.tg.en{border-color:rgba(139,42,42,.45);color:var(--bloodb)}
.tg.en:hover{border-color:var(--bloodb)}
.ch-list{display:flex;flex-direction:column;gap:.28rem}
.ch-i{font-family:'IM Fell English',serif;font-size:.8rem;color:var(--parchd);font-style:italic;padding:.18rem 0;border-bottom:1px solid rgba(61,42,20,.3)}
.mo-epi{font-family:'IM Fell English',serif;font-style:italic;font-size:.78rem;color:var(--bloodb)}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a href="index.html" class="nav-brand">Son İmparator</a>
    <button class="nav-ham" id="ham" aria-label="Menü"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="navl">
      <li><a href="index.html" id="nl-home">Ana Sayfa</a></li>

    </ul>
    <div class="nav-r">

    </div>
  </div>
</nav>

<header class="pg-hero">
  <h1 id="hero-title">Karakterler</h1>
  <p id="hero-sub">Destanın köşe taşları — tahtlar kuranlar, tahtlar yıkanlar ve ortada sıkışıp kalanlar.</p>
</header>

<div class="ctrl">
  <div class="ctrl-in">
    <div class="srch-w">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="srch" placeholder="Karakter ara...">
    </div>
    <div class="filters" id="flt"></div>
    <span class="ctrl-stat" id="stat"></span>
  </div>
</div>

<section class="chars-sec">
  <div class="c-inn">
    <div class="char-grid" id="grid"></div>
    <p class="no-r" id="nor"></p>
  </div>
</section>

<div class="mo" id="mo" onclick="ovcClick(event)">
  <div class="mo-box" id="mo-box"></div>
</div>

<script>
// ─── LANGUAGE ──────────────────────────────────────────────
let L = localStorage.getItem('si-lang') || 'tr';
const T = o => (o && o[L]) || (o && o.tr) || '';

// ─── DATA ──────────────────────────────────────────────────
const GROUPS = {
  all:      {tr:'Tümü',        en:'All'},
  stallhart:{tr:'Stallhart Hanedanı', en:'Dynasty'},
  arhan:    {tr:'Arhan Hanesi',en:'House Arhan'},
  solgar:   {tr:'Solgar Hanesi',en:'House Solgar'},
  selya:    {tr:'Selya Hanesi',en:'House Selya'},

  historical:{tr:'Tarihsel Figür',en:'Historical Figure'}
};

const META_LABELS = {
  birth: {tr:'Doğum Yeri', en:'Birthplace'},
  alleg: {tr:'Bağlılık',   en:'Allegiance'},
  stat:  {tr:'Durum',      en:'Status'},
  allies:{tr:'Müttefikler',en:'Allies'},
  enems: {tr:'Düşmanlar',  en:'Enemies'},
  chaps: {tr:'Bölümlerde Geçiyor', en:'Appears In'},
  results:{tr:'karakter gösteriliyor', en:'characters shown'},
  nores: {tr:'Sonuç bulunamadı.', en:'No results found.'},
  search:{tr:'Karakter ara...', en:'Search characters...'}
};

const NAV_LABELS = {
  home:    {tr:'Ana Sayfa', en:'Home'},
  lore:    {tr:'Evren',     en:'Lore'},
  chars:   {tr:'Karakterler',en:'Characters'},
  chapters:{tr:'Bölümler',  en:'Chapters'},
  map:     {tr:'Harita',    en:'Map'},
  htitle:  {tr:'Karakterler',en:'Characters'},
  hsub:    {tr:'Destanın köşe taşları — tahtlar kuranlar, tahtlar yıkanlar ve ortada sıkışıp kalanlar.',
            en:'The pillars of the epic — those who built thrones, those who toppled them, and those caught between.'}
};

const CHARS = [
  // ── STALLHART DYNASTY ─────────────────────────────────
  {id:'zeandor',group:'stallhart',status:'alive',
   name:{tr:'Zeandor Stallhart',en:'Zeandor Stallhart'},
   house:{tr:'İmparatorluk Hanedanı',en:'Imperial Dynasty'},
   title:{tr:'Melik Vali → İmparator',en:'Governor King → Emperor'},
   birth:{tr:'Başkent',en:'The Capital'},
   alleg:{tr:'Stallhart İmparatorluğu',en:'Stallhart Empire'},
   epi:{tr:'Yarının Hükümdarı · Sürgünün Oğlu',en:'Tomorrow\'s Sovereign · Son of Exile'},
   quote:{tr:'İmparatorluk bir zincirdir. Zayıf halkayı bulursun, onu koparırsın — gerisi kendiliğinden çözülür.',en:'The empire is a chain. Find the weak link, break it — the rest unravels on its own.'},
   bio:{tr:'9 yaşında Selya\'ya sürgün edilen Zeandor, bilge Celios\'un yanında olgunlaştı. Soğuk, hesaplı; ama adalete karşı körlüğü yoktur. Liman vinci icadından "Kör Yengeç" tavernası kimliğine, Erthan\'ın isyanını bastırmaktan tahta çıkmaya uzanan bir yol. Bir şehidin ölümü imparatorun doğuşuna dönüştü.',
        en:'Exiled to Selya at age 9, Zeandor came of age under the wise Celios. Cold and calculating, yet not blind to justice. From inventing the port crane to bearing a tavern alias, from ending Erthan\'s rebellion to ascending the throne — a martyr\'s death became an emperor\'s birth.'},
   allies:['liaher','celios','elyndra'],enemies:['erthan','edun-solgar','reun-solgar'],
   chapters:['Bölüm – Muhafız','Bölüm – Karar']},

  {id:'amadon',group:'stallhart',status:'deceased',
   name:{tr:'Amadon Stallhart',en:'Amadon Stallhart'},
   house:{tr:'İmparatorluk Hanedanı',en:'Imperial Dynasty'},
   title:{tr:'Seltanya Meliki → İmparator',en:'Melik of Seltanya → Emperor'},
   birth:{tr:'Başkent',en:'The Capital'},
   alleg:{tr:'Stallhart İmparatorluğu',en:'Stallhart Empire'},
   epi:{tr:'Enkazın Hükümdarı',en:'Sovereign of the Ruins'},
   quote:{tr:'Bir imparatorluğu taştan inşa ederler. Ben onu korkudan inşa ettim.',en:'They build empires from stone. I built mine from fear.'},
   bio:{tr:'Zekâsı ve kararlılığıyla çürüyen imparatorluğu yeniden ayağa kaldırdı. Karabıçaklar\'ı kurdu, veba döneminde hüküm sürdü, ama paranoyası giderek büyüdü. Ölüm döşeğinde yazdığı mühürlü fermanlar imparatorluğun kaderini belirledi.',
        en:'His intellect and resolve revived a crumbling empire. Founded the Black Claws, reigned through plague, but his paranoia consumed him. Sealed edicts written on his deathbed determined the empire\'s fate.'},
   allies:[],enemies:['edun-solgar','erthan'],
   chapters:['Bölüm – Karar']},

  {id:'imloth',group:'stallhart',status:'deceased',
   name:{tr:'İmloth Stallhart',en:'Imloth Stallhart'},
   house:{tr:'İmparatorluk Hanedanı',en:'Imperial Dynasty'},
   title:{tr:'İmparator',en:'Emperor'},
   birth:{tr:'Başkent',en:'The Capital'},
   alleg:{tr:'Stallhart İmparatorluğu',en:'Stallhart Empire'},
   epi:{tr:'Tembel · Derin Tuzak',en:'The Lazy · The Deep Trap'},
   quote:{tr:'Bir imparator her şeyi bilemez. Bilen ise imparator değildir.',en:'An emperor cannot know everything. He who knows all is no emperor.'},
   bio:{tr:'Şişman, kel, apodik gözlü; paranoya ve suçluluk onu felç etti. Amadon\'un ağabeyi, Zeandor\'un babası. Pasifliği ve liyakatsizliği imparatorluğu çürümenin eşiğine getirdi. Hastalıktan hayatını kaybetti.',
        en:'Obese, bald, with apathetic eyes — paralyzed by paranoia and guilt. Amadon\'s older brother, Zeandor\'s father. His passivity and incompetence brought the empire to the brink of rot. Died of illness.'},
   allies:[],enemies:[],chapters:[]},

  {id:'lun-aldris',group:'stallhart',status:'alive',
   name:{tr:'Lun Aldris Stallhart',en:'Lun Aldris Stallhart'},
   house:{tr:'İmparatorluk Hanedanı',en:'Imperial Dynasty'},
   title:{tr:'Şehzade',en:'Crown Prince'},
   birth:{tr:'Başkent',en:'The Capital'},
   alleg:{tr:'Stallhart İmparatorluğu',en:'Stallhart Empire'},
   epi:{tr:'Ay Gözcüsü · Kutsal Işığın Varisi',en:'Moonwatcher · Heir of the Sacred Light'},
   quote:{tr:'',en:''},
   bio:{tr:'Amadon\'un küçük oğlu. Edun Solgar\'ın manipülasyonuyla annesi Meryen tarafından gizlice taç giydirilerek meşruiyet krizinin odağı oldu. Zeandor\'un yükselişinin ardından annesiyle birlikte başkentten kaçtı.',
        en:'Amadon\'s younger son. Manipulated by Edun Solgar into a secret coronation by his mother Meryen, becoming the center of a legitimacy crisis. Fled the capital with his mother after Zeandor\'s ascension.'},
   allies:['meryen'],enemies:['zeandor','edun-solgar'],chapters:[]},

  {id:'meryen',group:'stallhart',status:'alive',
   name:{tr:'Meryen Stallhart',en:'Meryen Stallhart'},
   house:{tr:'İmparatorluk Hanedanı',en:'Imperial Dynasty'},
   title:{tr:'İmparatoriçe',en:'Empress'},

let activeFilter = 'all';
let searchQ = '';

// ─── UTILITIES ─────────────────────────────────────────────
function initials(str) {
  return str.split(' ').filter(w=>w.length>1&&w[0]===w[0].toUpperCase()).slice(0,2).map(w=>w[0]).join('');
}
function byId(id) { return CHARS.find(c=>c.id===id); }
function getFiltered() {
  let ch = CHARS;
  if (activeFilter !== 'all') ch = ch.filter(c=>c.group===activeFilter);
  if (searchQ.trim()) {
    const q = searchQ.toLowerCase();
    ch = ch.filter(c =>
      T(c.name).toLowerCase().includes(q) ||
      T(c.house).toLowerCase().includes(q) ||
      T(c.title).toLowerCase().includes(q) ||
      (c.epi && T(c.epi).toLowerCase().includes(q)) ||
      T(c.bio).toLowerCase().includes(q)
    );
  }
  return ch;
}

// ─── RENDER ────────────────────────────────────────────────
function renderFilters() {
  document.getElementById('flt').innerHTML =
    Object.entries(GROUPS).map(([k,v])=>
      `<button class="fb${activeFilter===k?' on':''}" onclick="setFilter('${k}')">${T(v)}</button>`
    ).join('');
}

function renderCards() {
  const ch = getFiltered();
  const grid = document.getElementById('grid');
  const nor = document.getElementById('nor');
  const stat = document.getElementById('stat');
  stat.textContent = `${ch.length} ${T(META_LABELS.results)}`;
  if (!ch.length) {
    grid.innerHTML=''; nor.style.display='block';
    nor.textContent = T(META_LABELS.nores); return;
  }
  nor.style.display = 'none';
  grid.innerHTML = ch.map(c=>`
    <div class="cc ${c.group}" tabindex="0" role="button" aria-label="${T(c.name)}" onclick="openModal('${c.id}')" onkeydown="if(event.key==='Enter')openModal('${c.id}')">
      <div class="cc-dot ${c.status}"></div>
      <p class="cc-house">${T(c.house)}</p>
      <h3 class="cc-name">${T(c.name)}</h3>
      <p class="cc-role">${T(c.title)}</p>
      <p class="cc-bio">${T(c.bio)}</p>
      ${c.epi&&T(c.epi)?`<span class="cc-epi">${T(c.epi)}</span>`:''}
    </div>`).join('');
}

// ─── MODAL ─────────────────────────────────────────────────
function openModal(id) {
  const c = byId(id); if(!c) return;
  history.replaceState(null,'',`#${id}`);
  const allies = (c.allies||[]).map(aid=>{
    const a=byId(aid); return a?`<span class="tg" onclick="openModal('${aid}');event.stopPropagation()">${T(a.name)}</span>`:'';
  }).join('');
  const enems = (c.enemies||[]).map(eid=>{
    const e=byId(eid); return e?`<span class="tg en" onclick="openModal('${eid}');event.stopPropagation()">${T(e.name)}</span>`:'';
  }).join('');
  const chapters = (c.chapters||[]).map(ch=>`<div class="ch-i">${ch}</div>`).join('');
  const sl = T(STATUS[c.status])||c.status;

  document.getElementById('mo-box').innerHTML = `
    <button class="mo-close" onclick="closeModal()" aria-label="${L==='tr'?'Kapat':'Close'}">✕</button>
    <div class="mo-l">
      <div class="mo-portrait">
        <div class="mo-frame"></div>
        <span class="mo-init">${initials(T(c.name))}</span>
      </div>
      <div class="mo-badge" style="color:var(--c-${c.group})">${T(c.house)}</div>
      <div class="mo-meta">
        <div class="mo-mr"><span class="mo-ml">${T(META_LABELS.birth)}</span><span class="mo-mv">${T(c.birth)}</span></div>
        <div class="mo-mr"><span class="mo-ml">${T(META_LABELS.alleg)}</span><span class="mo-mv">${T(c.alleg)}</span></div>
        <div class="mo-mr"><span class="mo-ml">${T(META_LABELS.stat)}</span><span class="mo-mv">${sl}</span></div>
      </div>
    </div>
    <div class="mo-r">
      <div>
        <h2 class="mo-name">${T(c.name)}</h2>
        <p class="mo-title">${T(c.title)}</p>
        <div class="mo-rule"></div>
      </div>
      <p class="mo-bio">${T(c.bio)}</p>
      ${c.quote&&T(c.quote)?`<blockquote class="mo-quote">"${T(c.quote)}"</blockquote>`:''}
      ${c.epi&&T(c.epi)?`<p class="mo-epi">${T(c.epi)}</p>`:''}
      ${allies?`<div><p class="mo-sl">${T(META_LABELS.allies)}</p><div class="tag-list">${allies}</div></div>`:''}
      ${enems?`<div><p class="mo-sl">${T(META_LABELS.enems)}</p><div class="tag-list">${enems}</div></div>`:''}
      ${chapters?`<div><p class="mo-sl">${T(META_LABELS.chaps)}</p><div class="ch-list">${chapters}</div></div>`:''}
    </div>`;
  document.getElementById('mo').classList.add('vis');
  document.body.style.overflow='hidden';
}

function closeModal() {
  document.getElementById('mo').classList.remove('vis');
  document.body.style.overflow='';
  history.replaceState(null,'',window.location.pathname);
}
function ovcClick(e) { if(e.target===document.getElementById('mo')) closeModal(); }

// ─── FILTER & SEARCH ───────────────────────────────────────
function setFilter(g) { activeFilter=g; renderFilters(); renderCards(); }

// ─── LANGUAGE ──────────────────────────────────────────────
function applyLang() {
  document.getElementById('r').lang=L;
  document.getElementById('lang-btn').textContent=L==='tr'?'EN':'TR';
  document.getElementById('hero-title').textContent=T(NAV_LABELS.htitle);
  document.getElementById('hero-sub').textContent=T(NAV_LABELS.hsub);
  document.getElementById('nl-home').textContent=T(NAV_LABELS.home);
  document.getElementById('nl-lore').textContent=T(NAV_LABELS.lore);
  document.getElementById('nl-chars').textContent=T(NAV_LABELS.chars);
  document.getElementById('nl-chapters').textContent=T(NAV_LABELS.chapters);
  document.getElementById('nl-map').textContent=T(NAV_LABELS.map);
  document.getElementById('srch').placeholder=T(META_LABELS.search);
  document.title=(L==='tr'?'Karakterler':'Characters')+' — Son İmparator';
}
function toggleLang() {
  L=L==='tr'?'en':'tr';
  localStorage.setItem('si-lang',L);
  applyLang(); renderFilters(); renderCards();
  if(document.getElementById('mo').classList.contains('vis')) {
    const hash=window.location.hash.slice(1);
    if(hash) openModal(hash);
  }
}

// ─── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  applyLang();
  renderFilters();
  renderCards();
  document.getElementById('srch').addEventListener('input',e=>{searchQ=e.target.value;renderCards();});
  document.getElementById('ham').addEventListener('click',()=>document.getElementById('navl').classList.toggle('open'));
  document.querySelectorAll('#navl a').forEach(a=>a.addEventListener('click',()=>document.getElementById('navl').classList.remove('open')));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
  const hash=window.location.hash.slice(1);
  if(hash) setTimeout(()=>openModal(hash),80);
});
</script>
</body>
</html>
