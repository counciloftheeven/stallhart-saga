# Her push ve pull request'te sitenin bütünlüğünü denetler (scripts/check.mjs):
# JS sözdizimi, bozuk JSON, kırık yerel bağlantılar, tutarsız ?v= sürümleri,
# yinelenen kimlikler ve var olmayan karakter başvuruları.
# Eksik görsel dosyaları yalnızca UYARI'dır (katı mod için: node scripts/check.mjs --strict).
name: Site denetimi

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Denetimi çalıştır
        run: node scripts/check.mjs
